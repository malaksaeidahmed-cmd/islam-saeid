<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المدونة والنشرات الإخبارية | إسلام سعيد</title>
  <meta name="description" content="مقالات ونشرات عربية حول الميديا باينج، ROAS، واستراتيجيات النمو الإعلاني من إسلام سعيد." />
  <link rel="canonical" href="https://islamsaeid.me/blog.html" />
  <meta property="og:title" content="المدونة والنشرات الإخبارية | إسلام سعيد" />
  <meta property="og:description" content="تحليلات عملية واستراتيجيات إعلانية قابلة للتنفيذ لأصحاب المشاريع والمسوقين." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://islamsaeid.me/logo.png" />
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .blog-card-tag {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.65rem;
      font-weight: 600;
      background: rgba(217, 70, 239, 0.12);
      color: #f472b6;
      border: 1px solid rgba(217, 70, 239, 0.2);
    }
  </style>
</head>
<body class="bg-[#07060E] text-slate-200 font-['IBM_Plex_Sans_Arabic'] min-h-screen">

  <header class="glass-header border-b border-white/5 py-5 sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-5 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-3">
        <img src="logo.png" alt="شعار إسلام سعيد" class="w-9 h-9 object-contain rounded-lg" onerror="this.style.display='none'" />
        <span class="font-bold text-white">إسلام سعيد &bull; المدونة</span>
      </a>
      <a href="index.html" class="text-xs text-slate-300 hover:text-white">
        <i class="fa-solid fa-arrow-right ml-1"></i> العودة للموقع الرئيسي
      </a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-5 py-16 space-y-8">
    <div class="text-center space-y-3">
      <span class="text-xs font-bold text-pink-500 uppercase tracking-widest">معرفة وخبرات إعلانية</span>
      <h1 class="text-3xl font-bold text-white">نشرات الميديا باينج والنمو الإعلاني</h1>
      <p class="text-xs text-slate-400 max-w-lg mx-auto leading-relaxed">استراتيجيات متقدمة حول إعلانات Meta و TikTok واقتصاديات الوحدة لتنمية أعمالك.</p>
    </div>

    <div class="max-w-md mx-auto">
      <label for="blogSearchInput" class="sr-only">بحث في المقالات</label>
      <input type="text" id="blogSearchInput" placeholder="بحث في المقالات..."
        class="w-full bg-[#0E0B1A] border border-white/10 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-pink-500" />
    </div>

    <div id="categoryFilters" class="flex flex-wrap items-center justify-center gap-2">
      <button class="filter-chip active" data-cat="all">الكل</button>
    </div>

    <div id="blogStatus" class="text-center py-3 text-slate-500 text-xs">
      <i class="fa-solid fa-spinner fa-spin ml-2"></i>
      جاري جلب المقالات...
    </div>

    <div id="blogContainer" class="space-y-6"></div>
  </main>

  <script src="js/cms-data.js"></script>
  <script type="module">
    const statusEl = document.getElementById('blogStatus');
    const container = document.getElementById('blogContainer');
    const searchInput = document.getElementById('blogSearchInput');
    const filtersContainer = document.getElementById('categoryFilters');
    let allPosts = [];
    let activeCategory = 'all';
    let currentQuery = '';

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function cleanText(value) {
      return String(value ?? '').trim();
    }

    function stripHtml(html) {
      return String(html || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    }

    function isSafeMediaUrl(url) {
      if (!url) return false;
      try {
        const parsed = new URL(url, window.location.href);
        return ['http:', 'https:'].includes(parsed.protocol);
      } catch (_) { return false; }
    }

    // ============================================================
    // Build post URL — slug preferred, fallback to id
    // ============================================================
    function buildPostUrl(post) {
      if (post.slug) {
        return `post.html?slug=${encodeURIComponent(post.slug)}`;
      }
      return `post.html?id=${encodeURIComponent(post.id ?? '')}`;
    }

    function renderFilters() {
      const cats = new Set();
      allPosts.forEach(p => {
        const c = cleanText(p.category);
        if (c) cats.add(c);
      });

      if (!cats.size) { filtersContainer.innerHTML = ''; return; }

      const chips = [`<button class="filter-chip ${activeCategory === 'all' ? 'active' : ''}" data-cat="all">الكل</button>`];
      cats.forEach(c => {
        chips.push(`<button class="filter-chip ${activeCategory === c ? 'active' : ''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`);
      });
      filtersContainer.innerHTML = chips.join('');

      filtersContainer.querySelectorAll('.filter-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          activeCategory = btn.dataset.cat;
          renderFilters();
          applyFilters();
        });
      });
    }

    function renderBlog(posts) {
      if (!posts.length) {
        container.innerHTML = `
          <div class="text-center py-16 space-y-3">
            <i class="fa-solid fa-file-circle-question text-3xl text-slate-600"></i>
            <p class="text-slate-500 text-xs">لا توجد مقالات مطابقة للبحث حالياً.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = posts.map(p => {
        const rawText = p.excerpt || stripHtml(p.content);
        const excerpt = rawText.length > 160 ? `${rawText.substring(0, 160)}...` : rawText;
        const safeTitle = escapeHtml(p.title || 'بدون عنوان');
        const safeCategory = escapeHtml(p.category || 'عام');
        const safeAuthor = escapeHtml(p.author || 'إسلام سعيد');
        const postUrl = buildPostUrl(p);
        const hasImage = isSafeMediaUrl(p.image);
        const readingTime = p.readingTime || Math.max(1, Math.ceil(stripHtml(p.content).split(/\s+/).filter(Boolean).length / 200));
        const tags = Array.isArray(p.tags) ? p.tags.slice(0, 4) : [];

        const tagsHtml = tags.length
          ? `<div class="flex flex-wrap gap-1.5 mt-2">${tags.map(t => `<span class="blog-card-tag">#${escapeHtml(t)}</span>`).join('')}</div>`
          : '';

        return `
          <article class="p-6 rounded-3xl border border-white/10 bg-[#0E0B1A] hover:border-pink-500/40 transition-all flex flex-col justify-between overflow-safe-card group">
            ${hasImage ? `<img src="${escapeHtml(p.image)}" alt="غلاف المقال: ${safeTitle}" class="w-full h-48 object-cover rounded-2xl mb-4" onerror="this.style.display='none'" loading="lazy" />` : ''}
            <div class="space-y-3">
              <div class="flex items-center justify-between text-xs flex-wrap gap-2">
                <span class="text-pink-400 font-bold break-words-safe">${safeCategory}</span>
                <div class="flex items-center gap-3 text-slate-500">
                  <span><i class="fa-solid fa-clock"></i> ${readingTime} د</span>
                  <span>${new Date(p.createdAt || Date.now()).toLocaleDateString('ar-EG')}</span>
                </div>
              </div>
              <h2 class="text-xl font-bold text-white group-hover:text-pink-400 transition-colors break-words-safe leading-snug">
                <a href="${postUrl}">${safeTitle}</a>
              </h2>
              <p class="text-xs text-slate-300 leading-relaxed break-words-safe line-clamp-3">${escapeHtml(excerpt)}</p>
              ${tagsHtml}
            </div>
            <div class="pt-3 mt-4 border-t border-white/5 flex justify-between items-center text-xs gap-2 flex-wrap">
              <span class="text-slate-400 break-words-safe">
                <i class="fa-solid fa-pen-nib text-orange-400 ml-1"></i>${safeAuthor}
              </span>
              <a href="${postUrl}" class="text-pink-400 hover:text-white font-bold flex items-center gap-1">
                <span>اقرأ المقال</span>
                <i class="fa-solid fa-chevron-left text-[10px] group-hover:-translate-x-1 transition-transform"></i>
              </a>
            </div>
          </article>
        `;
      }).join('');
    }

    function setStatus(text) {
      statusEl.innerHTML = text;
      statusEl.classList.remove('hidden');
    }

    function hideStatus() {
      statusEl.classList.add('hidden');
    }

    function applyFilters() {
      let filtered = allPosts;
      if (activeCategory !== 'all') {
        filtered = filtered.filter(p => cleanText(p.category) === activeCategory);
      }
      if (currentQuery) {
        const q = currentQuery.toLowerCase();
        filtered = filtered.filter(p => {
          const inTitle = cleanText(p.title).toLowerCase().includes(q);
          const inContent = cleanText(p.content).toLowerCase().includes(q);
          const inTags = Array.isArray(p.tags) && p.tags.some(t => String(t).toLowerCase().includes(q));
          const inFocus = cleanText(p.focusKeyword).toLowerCase().includes(q);
          return inTitle || inContent || inTags || inFocus;
        });
      }
      renderBlog(filtered);
    }

    searchInput?.addEventListener('input', (e) => {
      currentQuery = String(e.target.value || '').trim();
      applyFilters();
    });

    async function loadPosts() {
      try {
        const { CloudCMS } = await import('./js/firebase-cms.js');
        CloudCMS.subscribeBlog(posts => {
          allPosts = Array.isArray(posts) ? posts : [];
          hideStatus();
          renderFilters();
          applyFilters();
        });
        return;
      } catch (error) {
        console.warn('Cloud blog data unavailable, using local fallback.', error);
      }

      if (window.cmsEngine?.getBlog) {
        allPosts = window.cmsEngine.getBlog() || [];
        setStatus('يتم عرض نسخة محلية بسبب تعذر الاتصال بالسحابة.');
        renderFilters();
        applyFilters();
      } else {
        setStatus('تعذر تحميل المقالات حالياً.');
      }
    }

    loadPosts();
  </script>
</body>
</html>
