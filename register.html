<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إنشاء حساب | أكاديمية إسلام سعيد</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { background: radial-gradient(circle at top right, #16112b 0%, #07060E 60%); }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    .shake { animation: shake 0.4s ease-in-out; }
    input:focus, select:focus { box-shadow: 0 0 0 3px rgba(217, 70, 239, 0.15); }
    .strength-bar { height: 4px; border-radius: 9999px; transition: all 0.3s ease; }
  </style>
</head>
<body class="font-['IBM_Plex_Sans_Arabic'] min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

  <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-purple-600/10 rounded-full blur-[120px] pointer-events-none"></div>
  <div class="absolute bottom-0 left-0 w-[400px] h-[400px] bg-pink-600/10 rounded-full blur-[120px] pointer-events-none"></div>

  <div class="relative w-full max-w-md my-8">
    
    <div class="text-center mb-6">
      <img src="logo.png" alt="إسلام سعيد" class="w-14 h-14 object-contain rounded-2xl border border-white/10 mx-auto" onerror="this.style.display='none'" />
      <h1 class="text-white font-bold text-xl mt-4">انضم لأكاديمية إسلام سعيد</h1>
      <p class="text-slate-400 text-xs mt-1">ابدأ رحلتك من الصفر حتى الاحتراف</p>
    </div>

    <div class="p-8 rounded-3xl border border-white/10 bg-[#0E0B1A]/80 backdrop-blur-xl shadow-2xl space-y-5">

      <form id="registerForm" class="space-y-4 text-xs" novalidate>

        <!-- Name -->
        <div>
          <label for="nameInput" class="block font-semibold text-slate-300 mb-1.5">
            الاسم الكامل
          </label>
          <div class="relative">
            <i class="fa-solid fa-user absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm pointer-events-none"></i>
            <input type="text" id="nameInput" required autocomplete="name" placeholder="اسمك الثلاثي"
              class="w-full bg-black/40 border border-white/10 rounded-xl p-3 pr-10 text-white text-sm focus:outline-none focus:border-pink-500 transition-colors" />
          </div>
        </div>

        <!-- Email -->
        <div>
          <label for="emailInput" class="block font-semibold text-slate-300 mb-1.5">
            البريد الإلكتروني
          </label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm pointer-events-none"></i>
            <input type="email" id="emailInput" required autocomplete="email" placeholder="you@example.com" dir="ltr"
              class="w-full bg-black/40 border border-white/10 rounded-xl p-3 pr-10 text-white text-left text-sm focus:outline-none focus:border-pink-500 transition-colors" />
          </div>
        </div>

        <!-- Country -->
        <div>
          <label for="countryInput" class="block font-semibold text-slate-300 mb-1.5">
            الدولة
          </label>
          <select id="countryInput"
            class="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-pink-500 transition-colors">
            <option value="EG" selected>🇪🇬 مصر</option>
            <option value="SA">🇸🇦 السعودية</option>
            <option value="AE">🇦🇪 الإمارات</option>
            <option value="KW">🇰🇼 الكويت</option>
            <option value="QA">🇶🇦 قطر</option>
            <option value="BH">🇧🇭 البحرين</option>
            <option value="OM">🇴🇲 عمان</option>
            <option value="JO">🇯🇴 الأردن</option>
            <option value="MA">🇲🇦 المغرب</option>
            <option value="DZ">🇩🇿 الجزائر</option>
            <option value="TN">🇹🇳 تونس</option>
            <option value="OTHER">دولة أخرى</option>
          </select>
        </div>

        <!-- Password -->
        <div>
          <label for="passwordInput" class="block font-semibold text-slate-300 mb-1.5">
            كلمة المرور
          </label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm pointer-events-none"></i>
            <input type="password" id="passwordInput" required autocomplete="new-password" placeholder="8 أحرف على الأقل"
              class="w-full bg-black/40 border border-white/10 rounded-xl p-3 pr-10 pl-12 text-white text-sm focus:outline-none focus:border-pink-500 transition-colors" />
            <button type="button" id="togglePasswordBtn" aria-label="إظهار/إخفاء كلمة المرور"
              class="absolute left-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/5">
              <i id="togglePasswordIcon" class="fa-solid fa-eye text-sm"></i>
            </button>
          </div>
          <div class="mt-2 space-y-1">
            <div class="flex gap-1">
              <div id="strengthBar1" class="strength-bar flex-1 bg-white/10"></div>
              <div id="strengthBar2" class="strength-bar flex-1 bg-white/10"></div>
              <div id="strengthBar3" class="strength-bar flex-1 bg-white/10"></div>
              <div id="strengthBar4" class="strength-bar flex-1 bg-white/10"></div>
            </div>
            <div id="strengthText" class="text-[10px] text-slate-500">استخدم 8 أحرف على الأقل مع أرقام ورموز</div>
          </div>
        </div>

        <!-- Confirm Password -->
        <div>
          <label for="confirmPasswordInput" class="block font-semibold text-slate-300 mb-1.5">
            تأكيد كلمة المرور
          </label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm pointer-events-none"></i>
            <input type="password" id="confirmPasswordInput" required autocomplete="new-password" placeholder="أعد كلمة المرور"
              class="w-full bg-black/40 border border-white/10 rounded-xl p-3 pr-10 text-white text-sm focus:outline-none focus:border-pink-500 transition-colors" />
          </div>
          <div id="matchText" class="mt-1 text-[10px] text-slate-500"></div>
        </div>

        <!-- Terms -->
        <label class="flex items-start gap-2 cursor-pointer select-none">
          <input type="checkbox" id="termsInput" required
            class="mt-0.5 w-4 h-4 rounded border-white/20 bg-black/50 accent-pink-600 cursor-pointer" />
          <span class="text-slate-300 text-[11px] leading-relaxed">
            أوافق على
            <a href="#" class="text-pink-400 hover:text-pink-300 underline">الشروط والأحكام</a>
            و
            <a href="#" class="text-pink-400 hover:text-pink-300 underline">سياسة الخصوصية</a>
          </span>
        </label>

        <!-- Error Box -->
        <div id="errorBox" class="hidden p-3 rounded-lg bg-red-500/15 border border-red-500/30 text-red-300 text-center font-semibold text-[11px] leading-relaxed">
          <i class="fa-solid fa-circle-exclamation ml-1"></i>
          <span id="errorText"></span>
        </div>

        <!-- Success Box -->
        <div id="successBox" class="hidden p-3 rounded-lg bg-green-500/15 border border-green-500/30 text-green-300 text-center font-semibold text-[11px] leading-relaxed">
          <i class="fa-solid fa-circle-check ml-1"></i>
          <span id="successText"></span>
        </div>

        <!-- Submit -->
        <button type="submit" id="submitBtn"
          class="w-full py-3 rounded-xl bg-gradient-to-r from-pink-600 to-purple-600 text-white font-bold shadow-lg text-sm disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center gap-2 hover:opacity-95 transition-opacity">
          <i class="fa-solid fa-user-plus"></i>
          <span id="submitBtnText">إنشاء الحساب</span>
        </button>

        <p class="text-center text-[10px] text-slate-500">
          <i class="fa-solid fa-shield-halved text-green-400/70"></i>
          بياناتك محمية ومشفرة
        </p>

      </form>

      <div class="flex items-center gap-3">
        <div class="flex-1 h-px bg-white/10"></div>
        <span class="text-[10px] text-slate-500">لديك حساب بالفعل؟</span>
        <div class="flex-1 h-px bg-white/10"></div>
      </div>

      <a href="auth.html" class="block w-full py-3 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 text-center text-white text-sm font-bold transition-colors">
        <i class="fa-solid fa-right-to-bracket ml-1"></i>
        تسجيل الدخول
      </a>

    </div>

  </div>

  <script type="module">
    import { registerStudent, redirectIfLoggedIn } from './js/auth/firebase-auth.js';
    import { createUserProfile } from './js/auth/user-profile.js';

    const form = document.getElementById('registerForm');
    const nameInput = document.getElementById('nameInput');
    const emailInput = document.getElementById('emailInput');
    const countryInput = document.getElementById('countryInput');
    const passwordInput = document.getElementById('passwordInput');
    const confirmPasswordInput = document.getElementById('confirmPasswordInput');
    const termsInput = document.getElementById('termsInput');
    const submitBtn = document.getElementById('submitBtn');
    const submitBtnText = document.getElementById('submitBtnText');
    const errorBox = document.getElementById('errorBox');
    const errorText = document.getElementById('errorText');
    const successBox = document.getElementById('successBox');
    const successText = document.getElementById('successText');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const togglePasswordIcon = document.getElementById('togglePasswordIcon');
    const strengthBars = [
      document.getElementById('strengthBar1'),
      document.getElementById('strengthBar2'),
      document.getElementById('strengthBar3'),
      document.getElementById('strengthBar4')
    ];
    const strengthText = document.getElementById('strengthText');
    const matchText = document.getElementById('matchText');

    redirectIfLoggedIn('academy.html');

    // Toggle password visibility
    togglePasswordBtn?.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      togglePasswordIcon.className = isPassword ? 'fa-solid fa-eye-slash text-sm' : 'fa-solid fa-eye text-sm';
    });

    // Password strength meter
    passwordInput?.addEventListener('input', () => {
      const pwd = passwordInput.value;
      let score = 0;
      if (pwd.length >= 8) score++;
      if (pwd.length >= 12) score++;
      if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd)) score++;
      if (/\d/.test(pwd)) score++;
      if (/[!@#$%^&*(),.?":{}|<>]/.test(pwd)) score++;

      const levels = [
        { color: 'bg-red-500', text: 'ضعيفة جداً', textColor: 'text-red-400' },
        { color: 'bg-orange-500', text: 'ضعيفة', textColor: 'text-orange-400' },
        { color: 'bg-amber-500', text: 'متوسطة', textColor: 'text-amber-400' },
        { color: 'bg-green-500', text: 'قوية', textColor: 'text-green-400' },
        { color: 'bg-emerald-500', text: 'قوية جداً', textColor: 'text-emerald-400' }
      ];

      const levelIndex = Math.min(4, Math.max(0, score - 1));
      const level = levels[levelIndex];

      strengthBars.forEach((bar, i) => {
        bar.className = `strength-bar flex-1 ${i < score ? level.color : 'bg-white/10'}`;
      });

      if (pwd.length === 0) {
        strengthText.className = 'text-[10px] text-slate-500';
        strengthText.textContent = 'استخدم 8 أحرف على الأقل مع أرقام ورموز';
      } else {
        strengthText.className = `text-[10px] font-bold ${level.textColor}`;
        strengthText.textContent = level.text;
      }

      checkPasswordMatch();
    });

    // Password match check
    confirmPasswordInput?.addEventListener('input', checkPasswordMatch);

    function checkPasswordMatch() {
      const pwd = passwordInput.value;
      const confirm = confirmPasswordInput.value;
      if (!confirm) {
        matchText.textContent = '';
        matchText.className = 'mt-1 text-[10px] text-slate-500';
        return;
      }
      if (pwd === confirm) {
        matchText.textContent = '✓ كلمتا المرور متطابقتان';
        matchText.className = 'mt-1 text-[10px] text-green-400 font-bold';
      } else {
        matchText.textContent = '✕ كلمتا المرور غير متطابقتين';
        matchText.className = 'mt-1 text-[10px] text-red-400 font-bold';
      }
    }

    // Form submit
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();

      const displayName = nameInput.value.trim();
      const email = emailInput.value.trim();
      const country = countryInput.value;
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      // Validation
      if (!displayName || displayName.length < 2) { showError('ادخل اسمك الكامل (حرفين على الأقل)'); nameInput.focus(); return; }
      if (!email) { showError('ادخل البريد الإلكتروني'); emailInput.focus(); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError('البريد الإلكتروني غير صحيح'); emailInput.focus(); return; }
      if (password.length < 8) { showError('كلمة المرور يجب أن تكون 8 أحرف على الأقل'); passwordInput.focus(); return; }
      if (password !== confirmPassword) { showError('كلمتا المرور غير متطابقتين'); confirmPasswordInput.focus(); return; }
      if (!termsInput.checked) { showError('يجب الموافقة على الشروط والأحكام'); return; }

      // Disable UI
      submitBtn.disabled = true;
      const originalText = submitBtnText.textContent;
      submitBtnText.textContent = 'جاري إنشاء الحساب...';
      submitBtn.querySelector('i').className = 'fa-solid fa-spinner fa-spin';

      try {
        const { user } = await registerStudent({ email, password, displayName });

        await createUserProfile(user.uid, {
          email,
          displayName,
          country
        });

        showSuccess('✅ تم إنشاء حسابك بنجاح! جاري التحويل...');

        setTimeout(() => {
          window.location.href = 'academy.html';
        }, 1000);

      } catch (error) {
        console.error(error);
        showError(error.message);
        submitBtn.disabled = false;
        submitBtnText.textContent = originalText;
        submitBtn.querySelector('i').className = 'fa-solid fa-user-plus';
        form.classList.add('shake');
        setTimeout(() => form.classList.remove('shake'), 400);
      }
    });

    function showError(message) {
      errorText.textContent = message;
      errorBox.classList.remove('hidden');
      successBox.classList.add('hidden');
    }

    function showSuccess(message) {
      successText.textContent = message;
      successBox.classList.remove('hidden');
      errorBox.classList.add('hidden');
    }

    function hideMessages() {
      errorBox.classList.add('hidden');
      successBox.classList.add('hidden');
    }
  </script>
</body>
</html>
