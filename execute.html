<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>غرفة العمليات | إسلام سعيد</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-[#07060E] text-slate-200 font-['IBM_Plex_Sans_Arabic'] min-h-screen pb-20">

  <header class="glass-header border-b border-white/5 py-4 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <img src="logo.png" alt="Logo" class="w-8 h-8 object-contain" />
        <span class="font-bold text-white hidden sm:block">غرفة العمليات (Campaign Manager)</span>
      </div>
      <div class="flex items-center gap-3">
        <span id="headerPlatform" class="px-3 py-1 rounded-full bg-white/5 border border-white/10 text-xs text-slate-300">جاري التحميل...</span>
        <a href="index.html" class="text-xs text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-right ml-1"></i> الرئيسية</a>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-5 py-8 space-y-6">
    
    <!-- No Campaign Found -->
    <div id="noCampaignView" class="hidden p-10 rounded-3xl glass-card text-center space-y-6 max-w-2xl mx-auto mt-10">
      <i class="fa-solid fa-satellite-dish text-4xl text-slate-500"></i>
      <h2 class="text-xl font-bold text-white">لا توجد حملات نشطة</h2>
      <p class="text-sm text-slate-400">اذهب لصفحة المنصات وأنشئ حملتك الأولى للبدء.</p>
      <div class="flex justify-center gap-3 mt-4">
        <a href="platforms/meta.html" class="px-4 py-2 rounded-lg bg-blue-600 text-white text-xs font-bold">Meta</a>
        <a href="platforms/tiktok.html" class="px-4 py-2 rounded-lg bg-black border border-white/20 text-white text-xs font-bold">TikTok</a>
        <a href="platforms/google.html" class="px-4 py-2 rounded-lg bg-white text-black text-xs font-bold">Google</a>
      </div>
    </div>

    <!-- Dashboard View -->
    <div id="dashboardView" class="hidden space-y-6">
      <div class="flex items-center justify-between p-4 rounded-2xl bg-[#0E0B1A] border border-white/10">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 rounded-xl bg-purple-500/20 text-purple-400 flex items-center justify-center font-bold font-sans text-xl" id="currentDayBox">1</div>
          <div>
            <div class="text-sm font-bold text-white">اليوم <span id="currentDayText">1</span> من <span id="totalDaysText">30</span></div>
            <div class="text-[10px] text-slate-400" id="campaignStatusText">نشط (Active)</div>
          </div>
        </div>
        <button onclick="simulateDay()" id="nextDayBtn" class="px-6 py-2 rounded-lg bg-gradient-to-r from-green-600 to-emerald-600 text-white font-bold text-xs shadow-md">
          اليوم التالي <i class="fa-solid fa-arrow-left mr-1"></i>
        </button>
      </div>

      <div id="alertsContainer" class="space-y-2"></div>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="p-4 rounded-2xl bg-[#0E0B1A] border border-white/10">
          <div class="text-[10px] text-slate-400 mb-1">الإنفاق (Spend)</div>
          <div class="text-xl font-bold text-white font-sans" id="kpiSpend">0 ج.م</div>
        </div>
        <div class="p-4 rounded-2xl bg-[#0E0B1A] border border-white/10">
          <div class="text-[10px] text-slate-400 mb-1">الإيرادات (Revenue)</div>
          <div class="text-xl font-bold text-green-400 font-sans" id="kpiRevenue">0 ج.م</div>
        </div>
        <div class="p-4 rounded-2xl bg-[#0E0B1A] border border-white/10">
          <div class="text-[10px] text-slate-400 mb-1">العائد (ROAS)</div>
          <div class="text-xl font-bold text-pink-400 font-sans" id="kpiRoas">0x</div>
        </div>
        <div class="p-4 rounded-2xl bg-[#0E0B1A] border border-white/10">
          <div class="text-[10px] text-slate-400 mb-1">الطلبات (Orders)</div>
          <div class="text-xl font-bold text-white font-sans" id="kpiOrders">0</div>
        </div>
      </div>

      <div class="p-6 rounded-3xl bg-[#0E0B1A] border border-white/10">
        <canvas id="campaignChart" class="w-full max-h-64"></canvas>
      </div>

      <div class="p-6 rounded-3xl bg-[#0E0B1A] border border-white/10 overflow-x-auto">
        <table class="w-full text-right text-xs">
          <thead class="text-slate-400 border-b border-white/10">
            <tr>
              <th class="pb-3 px-2">اليوم</th><th class="pb-3 px-2">الإنفاق</th><th class="pb-3 px-2">الإيرادات</th>
              <th class="pb-3 px-2">ROAS</th><th class="pb-3 px-2">CPA</th><th class="pb-3 px-2">الطلبات</th>
            </tr>
          </thead>
          <tbody id="logTableBody" class="divide-y divide-white/5"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script type="module">
    import { simulateNextDay } from './js/execution/campaign-simulator.js';
    import { generateDailyAlerts } from './js/execution/optimization-engine.js';

    let campaign = null;
    let dailyLogs = [];
    let chartInstance = null;

    // Search for any platform campaign
    const platforms = ['meta', 'tiktok', 'google', 'linkedin', 'snapchat'];
    for (let p of platforms) {
      const data = localStorage.getItem(`executable_${p}_campaign`) || localStorage.getItem('executable_campaign');
      if (data) {
        campaign = JSON.parse(data);
        break;
      }
    }

    if (!campaign) {
      document.getElementById('noCampaignView').classList.remove('hidden');
    } else {
      document.getElementById('dashboardView').classList.remove('hidden');
      document.getElementById('headerPlatform').textContent = `المنصة: ${campaign.platform.toUpperCase()}`;
      document.getElementById('totalDaysText').textContent = campaign.duration;
      initChart();
    }

    window.simulateDay = () => {
      if (!campaign || campaign.currentDay >= campaign.duration) return;
      
      campaign.currentDay = (campaign.currentDay || 0) + 1;
      const dailyData = simulateNextDay(campaign, campaign.currentDay);
      
      const prev = dailyLogs.reduce((a, c) => ({ spend: a.spend + c.spend, revenue: a.revenue + c.revenue, orders: a.orders + c.orders }), { spend: 0, revenue: 0, orders: 0 });
      const newTotals = { spend: prev.spend + dailyData.spend, revenue: prev.revenue + dailyData.revenue, orders: prev.orders + dailyData.orders };
      newTotals.roas = newTotals.spend > 0 ? (newTotals.revenue / newTotals.spend) : 0;

      dailyLogs.push(dailyData);
      
      document.getElementById('currentDayBox').textContent = campaign.currentDay;
      document.getElementById('currentDayText').textContent = campaign.currentDay;
      document.getElementById('kpiSpend').textContent = newTotals.spend.toLocaleString('ar-EG') + ' ج.م';
      document.getElementById('kpiRevenue').textContent = newTotals.revenue.toLocaleString('ar-EG') + ' ج.م';
      document.getElementById('kpiRoas').textContent = newTotals.roas.toFixed(2) + 'x';
      document.getElementById('kpiOrders').textContent = newTotals.orders;

      updateChart();
      
      const tbody = document.getElementById('logTableBody');
      const row = document.createElement('tr');
      row.innerHTML = `
        <td class="py-3 px-2 font-bold text-white">${dailyData.dayNumber}</td>
        <td class="py-3 px-2 font-sans">${dailyData.spend.toLocaleString('ar-EG')}</td>
        <td class="py-3 px-2 font-sans text-green-400">${dailyData.revenue.toLocaleString('ar-EG')}</td>
        <td class="py-3 px-2 font-sans ${dailyData.roas >= 1 ? 'text-green-400' : 'text-red-400'}">${dailyData.roas.toFixed(2)}x</td>
        <td class="py-3 px-2 font-sans">${dailyData.orders > 0 ? dailyData.cpa.toFixed(0) : '-'}</td>
        <td class="py-3 px-2 font-sans text-white">${dailyData.orders}</td>
      `;
      tbody.prepend(row);

      const alerts = generateDailyAlerts(campaign, dailyData, newTotals);
      document.getElementById('alertsContainer').innerHTML = alerts.map(a => `
        <div class="p-3 rounded-xl border ${a.type==='danger'?'bg-red-500/10 border-red-500/30 text-red-400':a.type==='success'?'bg-green-500/10 border-green-500/30 text-green-400':'bg-blue-500/10 border-blue-500/30 text-blue-400'} flex items-start gap-3">
          <i class="fa-solid ${a.icon} mt-0.5"></i>
          <div><div class="text-xs font-bold">${a.title}</div><div class="text-[11px] opacity-80">${a.desc}</div></div>
        </div>
      `).join('');
    };

    function initChart() {
      const ctx = document.getElementById('campaignChart').getContext('2d');
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [
          { label: 'الإنفاق', data: [], borderColor: '#f59e0b', tension: 0.3 },
          { label: 'الإيرادات', data: [], borderColor: '#22c55e', tension: 0.3 }
        ]},
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#cbd5e1' } } }, scales: { x: { ticks: { color: '#94a3b8' } }, y: { ticks: { color: '#94a3b8' } } } }
      });
    }

    function updateChart() {
      if (!chartInstance) return;
      chartInstance.data.labels = dailyLogs.map(d => `يوم ${d.dayNumber}`);
      chartInstance.data.datasets[0].data = dailyLogs.map(d => d.spend);
      chartInstance.data.datasets[1].data = dailyLogs.map(d => d.revenue);
      chartInstance.update();
    }
  </script>
</body>
</html>
