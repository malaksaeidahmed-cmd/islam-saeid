<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok Ads Manager | إسلام سعيد</title>
  <link rel="icon" type="image/png" href="../logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --tiktok-cyan: #25F4EE; --tiktok-red: #FE2C55; }
    body { font-family: 'IBM Plex Sans Arabic', sans-serif; background: #000000; color: white; }
    .tiktok-card { background: #1C1C1E; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; }
    .tiktok-input { width: 100%; background: #000; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; padding: 10px; color: white; font-size: 14px; }
    .tiktok-input:focus { outline: none; border-color: var(--tiktok-cyan); }
    .tiktok-btn { background: var(--tiktok-red); color: white; font-weight: bold; border-radius: 4px; padding: 10px 20px; transition: 0.2s; }
    .tiktok-btn:hover { opacity: 0.9; }
    .tiktok-btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: white; }
    .tiktok-btn-outline:hover { background: rgba(255,255,255,0.1); }
    
    /* TikTok Mobile Preview */
    .phone-mockup { width: 280px; height: 500px; background: #000; border: 8px solid #333; border-radius: 30px; position: relative; overflow: hidden; margin: 0 auto; }
    .phone-mockup video, .phone-mockup .video-placeholder { width: 100%; height: 100%; object-fit: cover; }
    .tiktok-ui-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px 12px; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); }
    .tiktok-cta-btn { background: var(--tiktok-cyan); color: #000; font-weight: bold; width: 100%; padding: 10px; border-radius: 4px; margin-top: 10px; text-align: center; font-size: 14px; }
    .tiktok-side-icons { position: absolute; right: 12px; bottom: 100px; display: flex; flex-direction: column; gap: 16px; align-items: center; }
  </style>
</head>
<body class="min-h-screen">

  <header class="border-b border-white/10 bg-[#1C1C1E] py-4 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <a href="../index.html" class="text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-right"></i></a>
        <i class="fa-brands fa-tiktok text-2xl text-white"></i>
        <span class="font-bold">TikTok Ads Manager</span>
      </div>
      <div class="text-xs text-slate-400">الحساب: <strong class="text-white">Islam Saeed Academy</strong></div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-5 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Forms -->
      <div class="lg:col-span-2 space-y-4">
        <!-- Error Box -->
        <div id="errorBox" class="hidden p-3 rounded-lg bg-red-500/20 border border-red-500/40 text-red-400 text-xs font-bold"></div>

        <div class="flex gap-2 mb-4">
          <div class="flex-1 h-1 bg-[#25F4EE] rounded-full" id="indicator1"></div>
          <div class="flex-1 h-1 bg-white/10 rounded-full" id="indicator2"></div>
        </div>

        <!-- STEP 1: Campaign -->
        <div id="step1" class="space-y-4">
          <div class="tiktok-card p-6">
            <h2 class="text-lg font-bold mb-4">1. إعداد الحملة (Campaign)</h2>
            <div class="grid grid-cols-2 gap-3 mb-4">
              <label class="p-3 border border-white/20 rounded cursor-pointer hover:bg-white/5" onclick="setTT('campaign','objective','CONVERSIONS')">
                <input type="radio" name="tt_obj" class="accent-[#FE2C55]" checked /> <span class="text-sm font-bold ml-2">مبيعات (Conversions)</span>
              </label>
              <label class="p-3 border border-white/20 rounded cursor-pointer hover:bg-white/5" onclick="setTT('campaign','objective','TRAFFIC')">
                <input type="radio" name="tt_obj" class="accent-[#FE2C55]" /> <span class="text-sm font-bold ml-2">زيارات (Traffic)</span>
              </label>
            </div>
            <div class="space-y-3">
              <div>
                <label class="block text-xs text-slate-400 mb-1">اسم الحملة</label>
                <input type="text" id="tt_campaignName" class="tiktok-input" placeholder="TT_Sales_Summer_2025" oninput="setTT('campaign','name',this.value)" />
              </div>
              <div>
                <label class="block text-xs text-slate-400 mb-1">ميزانية الحملة اليومية (ج.م)</label>
                <input type="number" id="tt_campaignBudget" class="tiktok-input" placeholder="1000" oninput="setTT('campaign','budget',parseFloat(this.value)||0)" />
              </div>
            </div>
          </div>
        </div>

        <!-- STEP 2: Ad Group -->
        <div id="step2" class="hidden space-y-4">
          <div class="tiktok-card p-6">
            <h2 class="text-lg font-bold mb-4">2. المجموعة الإعلانية (Ad Group)</h2>
            <div class="space-y-3">
              <div>
                <label class="block text-xs text-slate-400 mb-1">اسم المجموعة</label>
                <input type="text" id="tt_adGroupName" class="tiktok-input" placeholder="TT_Targeting_Broad" oninput="setTT('adGroup','name',this.value)" />
              </div>
              <div>
                <label class="block text-xs text-slate-400 mb-1">مكان الظهور (Placement)</label>
                <select id="tt_placement" class="tiktok-input" onchange="setTT('adGroup','placement',this.value)">
                  <option value="auto">تلقائي (Auto)</option>
                  <option value="tiktok">TikTok فقط</option>
                  <option value="pangle">Pangle فقط</option>
                </select>
              </div>
              <div>
                <label class="block text-xs text-slate-400 mb-1">استراتيجية المزايدة (Bidding)</label>
                <select id="tt_bidding" class="tiktok-input" onchange="setTT('adGroup','bidding',this.value)">
                  <option value="ocpm">oCPM (Optimized Conversions)</option>
                  <option value="cpm">CPM (الظهور)</option>
                  <option value="cpv">CPV (المشاهدة)</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- STEP 3: Ad -->
        <div id="step3" class="hidden space-y-4">
          <div class="tiktok-card p-6">
            <h2 class="text-lg font-bold mb-4">3. تصميم الإعلان (Ad)</h2>
            <div class="space-y-3">
              <div>
                <label class="block text-xs text-slate-400 mb-1">اسم الإعلان</label>
                <input type="text" id="tt_adName" class="tiktok-input" placeholder="TT_Video_UGC_01" oninput="setTT('ad','name',this.value)" />
              </div>
              <div>
                <label class="block text-xs text-slate-400 mb-1">نص الإعلان (Ad Text)</label>
                <textarea id="tt_adText" class="tiktok-input h-20" placeholder="اكتب النص الذي سيظهر في الفيديو..." oninput="setTT('ad','text',this.value); document.getElementById('prev_adText').textContent = this.value || 'نص الإعلان سيظهر هنا...';"></textarea>
              </div>
              <div>
                <label class="block text-xs text-slate-400 mb-1">زر الحث (CTA)</label>
                <select id="tt_cta" class="tiktok-input" onchange="setTT('ad','cta',this.value); document.getElementById('prev_cta').textContent = this.options[this.selectedIndex].text;">
                  <option value="SHOP_NOW">تسوق الآن (Shop Now)</option>
                  <option value="SIGN_UP">سجل الآن (Sign Up)</option>
                  <option value="LEARN_MORE">اعرف المزيد (Learn More)</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- Navigation -->
        <div class="flex justify-between items-center pt-4">
          <button id="prevBtn" onclick="handlePrev()" class="tiktok-btn tiktok-btn-outline hidden">السابق</button>
          <div class="flex-1"></div>
          <button id="nextBtn" onclick="handleNext()" class="tiktok-btn">التالي</button>
          <button id="launchBtn" onclick="handleLaunch()" class="tiktok-btn hidden" style="background:#00C853;">إطلاق الحملة <i class="fa-solid fa-rocket mr-1"></i></button>
        </div>

      </div>

      <!-- Mobile Preview -->
      <div class="lg:col-span-1">
        <div class="sticky top-24">
          <h3 class="text-xs font-bold text-slate-400 mb-2 text-center">معاينة الإعلان (Mobile)</h3>
          <div class="phone-mockup">
            <div class="video-placeholder bg-slate-800 flex items-center justify-center">
              <i class="fa-solid fa-video text-4xl text-slate-600"></i>
            </div>
            <div class="tiktok-side-icons text-white text-xl">
              <div class="flex flex-col items-center"><i class="fa-solid fa-heart"></i><span class="text-[10px]">1.2K</span></div>
              <div class="flex flex-col items-center"><i class="fa-solid fa-comment-dots"></i><span class="text-[10px]">45</span></div>
              <div class="flex flex-col items-center"><i class="fa-solid fa-share"></i><span class="text-[10px]">Share</span></div>
            </div>
            <div class="tiktok-ui-overlay">
              <div class="text-sm font-bold mb-1">@islamsaeed.academy</div>
              <div class="text-xs text-white/90 mb-2" id="prev_adText">نص الإعلان سيظهر هنا...</div>
              <div class="flex items-center gap-2 text-[10px] text-white/70">
                <i class="fa-solid fa-music"></i> Original Sound - Islam Saeed
              </div>
              <div class="tiktok-cta-btn" id="prev_cta">تسوق الآن</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { tiktokState, setTikTokState, validateTikTokStep, nextTikTokStep, prevTikTokStep, launchTikTokCampaign } from '../js/platforms/tiktok-ads-sim.js';

    window.setTT = (section, key, val) => setTikTokState(section, key, val);

    window.handleNext = () => {
      const res = nextTikTokStep();
      if (!res.success) { showError(res.error); return; }
      hideError();
      updateUI();
    };

    window.handlePrev = () => {
      if (prevTikTokStep()) updateUI();
    };

    window.handleLaunch = () => {
      const err = validateTikTokStep(3);
      if (err) { showError(err); return; }
      
      launchTikTokCampaign();
      document.getElementById('launchBtn').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري النشر...';
      setTimeout(() => { window.location.href = '../execute.html'; }, 1000);
    };

    function updateUI() {
      const step = tiktokState.currentStep;
      document.getElementById('step1').classList.add('hidden');
      document.getElementById('step2').classList.add('hidden');
      document.getElementById('step3').classList.add('hidden');
      document.getElementById(`step${step}`).classList.remove('hidden');

      document.getElementById('indicator1').style.background = step >= 1 ? '#25F4EE' : 'rgba(255,255,255,0.1)';
      document.getElementById('indicator2').style.background = step >= 2 ? '#25F4EE' : 'rgba(255,255,255,0.1)';

      document.getElementById('prevBtn').classList.toggle('hidden', step === 1);
      document.getElementById('nextBtn').classList.toggle('hidden', step === 3);
      document.getElementById('launchBtn').classList.toggle('hidden', step !== 3);
    }

    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent = msg;
      box.classList.remove('hidden');
    }
    function hideError() { document.getElementById('errorBox').classList.add('hidden'); }

    updateUI();
  </script>
</body>
</html>
