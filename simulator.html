  <style>
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(217, 70, 239, 0.4); } 50% { box-shadow: 0 0 0 12px rgba(217, 70, 239, 0); } }
    @keyframes numberPop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes shimmer { 0% { background-position: -1000px 0; } 100% { background-position: 1000px 0; } }
    .anim-fade-up { animation: fadeInUp 0.5s ease forwards; }
    .anim-pop { animation: numberPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .glow-pulse { animation: pulseGlow 2s infinite; }

    .option-card { transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
    .option-card:hover { transform: translateY(-2px); }
    .option-card.selected { border-color: #d946ef; background: rgba(217, 70, 239, 0.08); box-shadow: 0 0 0 1px #d946ef, 0 8px 24px rgba(217, 70, 239, 0.15); }
    .option-card.selected .check-icon { opacity: 1; transform: scale(1); }
    .option-card .check-icon { opacity: 0; transform: scale(0.5); transition: all 0.25s ease; }

    .metric-card { position: relative; overflow: hidden; }
    .metric-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, currentColor, transparent); opacity: 0.5; }

    input[type="range"] { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 9999px; background: rgba(255,255,255,0.1); }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%; background: linear-gradient(135deg, #d946ef, #7c3aed); cursor: pointer; box-shadow: 0 4px 12px rgba(217, 70, 239, 0.5); }
    input[type="range"]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: linear-gradient(135deg, #d946ef, #7c3aed); cursor: pointer; border: none; }

    .score-ring { transform: rotate(-90deg); transform-origin: center; }
    .score-ring-fill { stroke-dasharray: 283; transition: stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1); }

    .progress-bar { background: linear-gradient(90deg, #7c3aed, #d946ef, #f97316); }

            <i class="fa-solid fa-arrow-right ml-1"></i> السابق

          </div>
          <button id="nextBtn" onclick="nextStage()" class="px-4 py-2.5 rounded-xl bg-gradient-to-r from-pink-600 to-purple-600 text-white font-bold text-xs shadow-lg disabled:opacity-40 disabled:cursor-not-allowed">

  <!-- ============================================================ -->

  <div id="resultsModal" class="hidden fixed inset-0 z-[100] bg-black/95 backdrop-blur-sm overflow-y-auto">
    <div class="min-h-screen p-4 sm:p-8">
      <div class="max-w-6xl mx-auto bg-[#0E0B1A] border border-white/10 rounded-3xl overflow-hidden">
        
        <!-- Modal Header -->
        <div class="p-6 sm:p-8 bg-gradient-to-br from-purple-600/20 via-pink-600/10 to-transparent border-b border-white/10">

          <!-- Optimizations -->

              <i class="fa-solid fa-sliders ml-1"></i> تعديل الاستراتيجية
            </button>
            <button onclick="runSimulationClick()" class="px-5 py-3 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-white font-bold text-sm">
              <i class="fa-solid fa-redo ml-1"></i> إعادة المحاكاة
            </button>
            <button onclick="resetSimulator()" class="px-5 py-3 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-white font-bold text-sm">

  <!-- Report HTML Container for PDF -->
  <div id="reportPdfContainer" class="fixed -left-[9999px] top-0"></div>

  <script type="module">
    import {
      INDUSTRIES, PLATFORMS, OBJECTIVES, FRAMEWORKS, CHANNEL_TYPES,
      CREATIVE_TYPES, HOOK_QUALITY, OFFER_STRENGTH, LANDING_QUALITY,
      BIDDING_STRATEGY, OPT_EVENTS, TESTING, SCALING, RETENTION,
      ATTRIBUTION, BUSINESS_STAGE, JOURNEY_STAGES, PRICING_STRATEGY,
      SEASONALITY, CATEGORIES, DEFAULT_STATE
    } from './js/simulator-data.js';

    import { runSimulation, generateReportHTML } from './js/simulator-engine.js';

    // ============================================================
    // STATE
    // ============================================================
    let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    let currentStage = 0;

    const STAGES = [
      { id: 'foundation', name: 'أساسيات البيزنس', icon: 'fa-briefcase', short: 'الأساسيات' },
      { id: 'market', name: 'السوق والمنافسة', icon: 'fa-chart-line', short: 'السوق' },
      { id: 'persona', name: 'شخصية العميل', icon: 'fa-user-tie', short: 'العميل' },
      { id: 'objective', name: 'الهدف التسويقي', icon: 'fa-bullseye', short: 'الهدف' },
      { id: 'framework', name: 'الإطار التسويقي', icon: 'fa-diagram-project', short: 'الإطار' },
      { id: 'channels', name: 'استراتيجية القنوات', icon: 'fa-sitemap', short: 'القنوات' },
      { id: 'budget', name: 'الميزانية والإعلام', icon: 'fa-wallet', short: 'الميزانية' },
      { id: 'creative', name: 'الكرياتيف والرسالة', icon: 'fa-photo-film', short: 'الكرياتيف' },
      { id: 'funnel', name: 'الفانل والهبوط', icon: 'fa-filter', short: 'الفانل' },
      { id: 'optimization', name: 'المزايدة والتحسين', icon: 'fa-sliders', short: 'التحسين' },
      { id: 'scaling', name: 'التوسع والاحتفاظ', icon: 'fa-arrow-trend-up', short: 'التوسع' },
      { id: 'analytics', name: 'القياس والـ Attribution', icon: 'fa-chart-simple', short: 'القياس' }
    ];

    // ============================================================
    // PERSISTENCE
    // ============================================================
    function saveState() { try { localStorage.setItem('sim_v2_state', JSON.stringify(state)); } catch (_) {} }
    function loadState() {
      try {
        const raw = localStorage.getItem('sim_v2_state');
        if (raw) {
          const parsed = JSON.parse(raw);
          state = { ...DEFAULT_STATE, ...parsed };
        }
      } catch (_) {}
    }

    // ============================================================
    // HELPERS
    // ============================================================
    function escapeHtml(v) {
      return String(v ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function formatCurrency(n) {
      return Math.round(n).toLocaleString('ar-EG') + ' ج.م';
    }

    function optionCard(value, title, subtitle, icon, isSelected, onClick) {
      return `
        <button onclick="${onClick}"
          class="option-card w-full text-right p-4 rounded-2xl border ${isSelected ? 'selected' : 'border-white/10 bg-white/[0.02]'} flex items-start gap-3 relative">
          <div class="w-10 h-10 rounded-xl ${isSelected ? 'bg-pink-500/20 text-pink-400' : 'bg-white/5 text-slate-400'} flex items-center justify-center flex-shrink-0">
            <i class="fa-solid ${icon || 'fa-circle'}"></i>
          </div>
          <div class="flex-1 min-w-0">
            <div class="font-bold ${isSelected ? 'text-white' : 'text-slate-200'} text-sm">${title}</div>
            ${subtitle ? `<div class="text-[11px] text-slate-400 mt-0.5 leading-relaxed">${subtitle}</div>` : ''}
          </div>
          <i class="fa-solid fa-check-circle text-pink-400 check-icon absolute top-3 left-3"></i>
        </button>
      `;
    }

    // ============================================================
    // RENDER PROGRESS
    // ============================================================
    function renderProgress() {
      const container = document.getElementById('progressStages');
      container.innerHTML = STAGES.map((s, i) => {
        const isDone = i < currentStage;
        const isActive = i === currentStage;
        const cls = isActive
          ? 'bg-gradient-to-r from-purple-600 to-pink-600 text-white border-transparent'
          : isDone
            ? 'bg-green-500/20 text-green-300 border-green-500/40'
            : 'bg-white/5 text-slate-400 border-white/10';
        return `
          <button onclick="goToStage(${i})" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full border whitespace-nowrap transition-all ${cls}">
            <i class="fa-solid ${isDone ? 'fa-check' : s.icon} text-[10px]"></i>
            <span>${s.short}</span>
          </button>
        `;
      }).join('');

      const pct = ((currentStage + 1) / STAGES.length) * 100;
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('stageProgressText').textContent = `${currentStage + 1} / ${STAGES.length}`;
      document.getElementById('stageTitleNav').textContent = STAGES[currentStage].name;
    }

    // ============================================================
    // LIVE SUMMARY
    // ============================================================
    function renderLiveSummary() {
      const s = state;

      // Completion
      let filled = 0;
      const totalChecks = 30;
      if (s.foundation.industry) filled++;
      if (s.foundation.businessStage) filled++;
      if (s.foundation.pricingStrategy) filled++;
      if (s.market.targetMarketSize) filled++;
      if (s.market.competitionLevel) filled++;
      if (s.market.marketMaturity) filled++;
      if (s.market.uniqueAdvantage) filled++;
      if (s.persona.journeyStage) filled++;
      if (s.persona.gender) filled++;
      if (s.persona.ageRange.length) filled++;
      if (s.persona.painPoints.length) filled++;
      if (s.objective.primaryGoal) filled++;
      if (s.framework.primary) filled++;
      if (s.channels.mix.length) filled++;
      if (s.channels.platforms.length) filled++;
      if (s.budget.totalBudget) filled++;
      if (s.budget.duration) filled++;
      if (s.creative.type) filled++;
      if (s.creative.hook) filled++;
      if (s.creative.offer) filled++;
      if (s.creative.messagingAngle) filled++;
      if (s.funnel.landingQuality) filled++;
      if (s.funnel.funnelType) filled++;
      if (s.optimization.bidding) filled++;
      if (s.optimization.event) filled++;
      if (s.optimization.testing) filled++;
      if (s.scaling.strategy) filled++;
      if (s.scaling.retention) filled++;
      if (s.analytics.attributionModel) filled++;
      if (s.analytics.trackingSetup) filled++;

      const pct = Math.round((filled / totalChecks) * 100);
      const badge = document.getElementById('completionBadge');
      badge.textContent = pct + '%';
      badge.className = pct >= 90
        ? 'px-2 py-0.5 rounded-full bg-green-500/20 text-green-400 text-[10px] font-bold'
        : pct >= 50
          ? 'px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-400 text-[10px] font-bold'
          : 'px-2 py-0.5 rounded-full bg-red-500/20 text-red-400 text-[10px] font-bold';

      document.getElementById('sidebarProgressBar').style.width = pct + '%';

      // Summary Rows
      const rows = [
        { label: 'القطاع', value: s.foundation.industry ? INDUSTRIES[s.foundation.industry].name : '—' },
        { label: 'المرحلة', value: s.foundation.businessStage ? BUSINESS_STAGE[s.foundation.businessStage].name : '—' },
        { label: 'الهدف', value: s.objective.primaryGoal ? OBJECTIVES[s.objective.primaryGoal].name : '—' },
        { label: 'الإطار', value: s.framework.primary ? FRAMEWORKS[s.framework.primary].name : '—' },
        { label: 'المنصات', value: s.channels.platforms.length ? s.channels.platforms.map(p => PLATFORMS[p].name).join('، ') : '—' },
        { label: 'الميزانية', value: s.budget.totalBudget ? s.budget.totalBudget.toLocaleString('ar-EG') + ' ج.م' : '—' },
        { label: 'المدة', value: s.budget.duration ? s.budget.duration + ' يوم' : '—' },
        { label: 'الكرياتيف', value: s.creative.type ? CREATIVE_TYPES[s.creative.type].name : '—' },
        { label: 'العرض', value: s.creative.offer ? OFFER_STRENGTH[s.creative.offer].name : '—' },
        { label: 'الفانل', value: s.funnel.funnelType || '—' }
      ];

      document.getElementById('liveSummary').innerHTML = rows.map(r => `
        <div class="flex items-center justify-between gap-2 py-1.5 border-b border-white/5 last:border-0">
          <span class="text-slate-500">${r.label}</span>
          <span class="text-white font-bold text-left truncate max-w-[60%]" title="${escapeHtml(r.value)}">${escapeHtml(r.value)}</span>
        </div>
      `).join('');

      // Live Estimate
      const estimateBox = document.getElementById('liveEstimate');
      const canEstimate = s.foundation.industry && s.channels.platforms.length && s.budget.totalBudget && s.objective.primaryGoal;
      if (canEstimate) {
        try {
          const testState = JSON.parse(JSON.stringify(state));
          // Fill minimal defaults to allow calculation
          if (!testState.foundation.businessStage) testState.foundation.businessStage = 'new';
          if (!testState.market.competitionLevel) testState.market.competitionLevel = 'medium';
          if (!testState.market.targetMarketSize) testState.market.targetMarketSize = 'national';
          if (!testState.persona.journeyStage) testState.persona.journeyStage = 'problemAware';
          if (!testState.framework.primary) testState.framework.primary = 'aida';
          if (!testState.channels.mix.length) testState.channels.mix = ['paid'];
          if (!testState.creative.type) testState.creative.type = 'static';
          if (!testState.creative.hook) testState.creative.hook = 'average';
          if (!testState.creative.offer) testState.creative.offer = 'none';
          if (!testState.funnel.landingQuality) testState.funnel.landingQuality = 'average';
          if (!testState.optimization.bidding) testState.optimization.bidding = 'lowestCost';
          if (!testState.optimization.event) testState.optimization.event = 'purchase';
          if (!testState.optimization.testing) testState.optimization.testing = 'none';
          if (!testState.scaling.retention) testState.scaling.retention = 'none';
          if (!testState.analytics.attributionModel) testState.analytics.attributionModel = 'linear';
          if (!testState.analytics.trackingSetup) testState.analytics.trackingSetup = 'basic';

          const result = runSimulation(testState);
          if (result.success) {
            const t = result.totals;
            estimateBox.classList.remove('hidden');
            estimateBox.innerHTML = `
              <div class="flex items-center gap-2 text-[11px] font-bold text-purple-300">
                <i class="fa-solid fa-bolt"></i> تقدير مبدئي
              </div>
              <div class="grid grid-cols-2 gap-2 text-[10px]">
                <div class="p-2 rounded-lg bg-black/30">
                  <div class="text-slate-500">ROAS</div>
                  <div class="text-white font-bold font-sans">${t.avgROAS.toFixed(2)}x</div>
                </div>
                <div class="p-2 rounded-lg bg-black/30">
                  <div class="text-slate-500">صافي ربح</div>
                  <div class="font-bold font-sans ${t.netProfit >= 0 ? 'text-green-400' : 'text-red-400'}">${Math.round(t.netProfit).toLocaleString('ar-EG')}</div>
                </div>
                <div class="p-2 rounded-lg bg-black/30">
                  <div class="text-slate-500">طلبات</div>
                  <div class="text-white font-bold font-sans">${t.totalOrders.toLocaleString('ar-EG')}</div>
                </div>
                <div class="p-2 rounded-lg bg-black/30">
                  <div class="text-slate-500">CPA</div>
                  <div class="text-amber-400 font-bold font-sans">${Math.round(t.avgCPA).toLocaleString('ar-EG')}</div>
                </div>
              </div>
            `;
          } else {
            estimateBox.classList.add('hidden');
          }
        } catch (err) {
          console.warn('Live estimate error:', err);
          estimateBox.classList.add('hidden');
        }
      } else {
        estimateBox.classList.add('hidden');
      }
    }

      const i = state.persona.ageRange.indexOf(age);

    function redistributeBudget() {
      const n = state.channels.platforms.length;
      if (!n) return;
      const each = Math.floor(state.budget.totalBudget / n);
      state.channels.platforms.forEach(pk => { state.budget.allocations[pk] = each; });
    }

    // DYNAMIC INPUT BINDING (for number/select inputs)
    // ============================================================
    function bindDynamicInputs() {
      const bind = (id, callback) => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('input', (e) => callback(e.target.value, e.target));
      };
      const bindChange = (id, callback) => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('change', (e) => callback(e.target.value, e.target));
      };

      bind('input_price', (v) => { state.foundation.price = +v; saveState(); renderLiveSummary(); });
      bind('input_cogs', (v) => { state.foundation.cogs = +v; saveState(); renderLiveSummary(); });
      bind('input_aov', (v) => { state.foundation.aov = +v; saveState(); renderLiveSummary(); });
      bind('input_kpiTarget', (v) => { state.objective.kpiTarget = +v; saveState(); });
      bind('input_timelineMonths', (v) => { state.objective.timelineMonths = +v; saveState(); });
      bind('input_totalBudget', (v) => { state.budget.totalBudget = +v; redistributeBudget(); saveState(); renderStage(); });
      bind('input_duration', (v) => { state.budget.duration = +v; saveState(); renderLiveSummary(); });
      bind('input_reservePercent', (v) => { state.budget.reservePercent = +v; saveState(); renderLiveSummary(); });
      bind('input_variants', (v) => { state.creative.variants = +v; saveState(); });
      bind('input_frequencyCap', (v) => { state.optimization.frequencyCap = +v; saveState(); });
      bindChange('input_productionQuality', (v) => { state.creative.productionQuality = v; saveState(); });
      bindChange('input_upsellStrategy', (v) => { state.scaling.upsellStrategy = v; saveState(); });

          const val = +e.target.value;
          state.budget.allocations[pk] = val;
          const valEl = document.getElementById(`alloc_${pk}_val`);
          const pctEl = document.getElementById(`alloc_${pk}_pct`);
          if (valEl) valEl.textContent = val.toLocaleString('ar-EG') + ' ج.م';
          if (pctEl && state.budget.totalBudget > 0) pctEl.textContent = `(${Math.round((val / state.budget.totalBudget) * 100)}%)`;
          saveState();
          renderLiveSummary();

                  <i class="fa-brands ${p.icon} text-lg" style="color:${p.color}"></i>
                  <span class="font-bold text-white text-sm">${p.name}</span>
                </div>
                <div class="flex items-center gap-2">
                  <span class="text-[10px] px-2 py-0.5 rounded-full ${p.frequencyWarning === 'high' ? 'bg-red-500/20 text-red-400' : p.frequencyWarning === 'medium' ? 'bg-amber-500/20 text-amber-400' : 'bg-green-500/20 text-green-400'}">
                    Freq: ${p.frequency}x
                  </span>
                  <span class="font-bold text-sm ${p.isProfitable ? 'text-green-400' : 'text-red-400'} font-sans">${p.roas.toFixed(2)}x ROAS</span>
                </div>
              </div>
              <div class="grid grid-cols-3 sm:grid-cols-6 gap-2 text-[10px] text-center">
                <div class="p-2 rounded bg-black/30"><div class="text-slate-500">الإنفاق</div><div class="text-white font-bold font-sans">${Math.round(p.budget).toLocaleString('ar-EG')}</div></div>
                <div class="p-2 rounded bg-black/30"><div class="text-slate-500">Impressions</div><div class="text-white font-bold font-sans">${(p.impressions/1000).toFixed(1)}K</div></div>
                <div class="p-2 rounded bg-black/30"><div class="text-slate-500">CTR</div><div class="text-white font-bold font-sans">${p.ctr}%</div></div>
                <div class="p-2 rounded bg-black/30"><div class="text-slate-500">CVR</div><div class="text-white font-bold font-sans">${p.cvr}%</div></div>
                <div class="p-2 rounded bg-black/30"><div class="text-slate-500">الطلبات</div><div class="text-white font-bold font-sans">${p.orders}</div></div>
                <div class="p-2 rounded bg-black/30"><div class="text-slate-500">CPA</div><div class="text-amber-400 font-bold font-sans">${Math.round(p.cpa).toLocaleString('ar-EG')}</div></div>
              </div>
            </div>
          `).join('')}
        </div>
      `;

      // Attribution Comparison
      const attributionModels = ['lastTouch', 'firstTouch', 'linear', 'timeDecay', 'position', 'dataDriven'];
      const modelNames = {
        lastTouch: 'Last-Touch',
        firstTouch: 'First-Touch',
        linear: 'Linear',
        timeDecay: 'Time-Decay',
        position: 'Position-Based',
        dataDriven: 'Data-Driven'
      };

      document.getElementById('attributionSection').innerHTML = `
        <h3 class="font-bold text-white text-sm flex items-center gap-2">
          <i class="fa-solid fa-diagram-project text-amber-400"></i> مقارنة نماذج الـ Attribution
        </h3>
        <p class="text-[10px] text-slate-400">كل نموذج بيوزع الفضل بشكل مختلف — ده يفسر ليه تقارير المنصات بتختلف عن بعض.</p>
        <div class="space-y-2">
          ${attributionModels.map(m => {
            const isRecommended = m === attribution.recommended;
            const totalValue = Object.values(attribution.models[m]).reduce((a, b) => a + b, 0);
            return `
              <div class="p-3 rounded-xl border ${isRecommended ? 'bg-amber-500/10 border-amber-500/40' : 'bg-white/[0.02] border-white/10'}">
                <div class="flex items-center justify-between mb-2">
                  <div class="flex items-center gap-2">
                    <span class="text-xs font-bold text-white">${modelNames[m]}</span>
                    ${isRecommended ? '<span class="text-[9px] px-2 py-0.5 rounded-full bg-amber-500/30 text-amber-300 font-bold">موصى به</span>' : ''}
                  </div>
                  <span class="text-xs font-bold font-sans text-pink-400">${formatCurrency(totalValue)}</span>
                </div>
                <div class="space-y-1">
                  ${platformResults.map(p => {
                    const val = attribution.models[m][p.platform] || 0;
                    const pct = totalValue > 0 ? (val / totalValue * 100) : 0;
                    return `
                      <div class="flex items-center gap-2 text-[10px]">
                        <span class="w-20 text-slate-400 truncate">${p.name}</span>
                        <div class="flex-1 h-1.5 rounded-full bg-white/5 overflow-hidden">
                          <div class="h-full rounded-full" style="width: ${pct}%; background: ${p.color};"></div>
                        </div>
                        <span class="w-12 text-left font-sans text-slate-300">${pct.toFixed(0)}%</span>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;

      // Learning Phase
      document.getElementById('learningPhaseSection').innerHTML = `
        <h3 class="font-bold text-white text-sm flex items-center gap-2">
          <i class="fa-solid fa-brain text-cyan-400"></i> مرحلة التعلم (Learning Phase)
        </h3>
        <div class="space-y-3">
          <div class="grid grid-cols-2 gap-2 text-[11px]">
            <div class="p-3 rounded-xl bg-black/30">
              <div class="text-slate-400">مدة التعلم</div>
              <div class="text-lg font-bold text-cyan-400 font-sans">${learningPhase.learningDays} يوم</div>
            </div>
            <div class="p-3 rounded-xl bg-black/30">
              <div class="text-slate-400">نسبة من الحملة</div>
              <div class="text-lg font-bold text-white font-sans">${learningPhase.learningPhasePercent}%</div>
            </div>
            <div class="p-3 rounded-xl bg-black/30">
              <div class="text-slate-400">إيرادات خلال التعلم</div>
              <div class="text-sm font-bold text-amber-400 font-sans">${formatCurrency(learningPhase.revenueDuringLearning)}</div>
            </div>
            <div class="p-3 rounded-xl bg-black/30">
              <div class="text-slate-400">إيرادات بعد التعلم</div>
              <div class="text-sm font-bold text-green-400 font-sans">${formatCurrency(learningPhase.revenueStable)}</div>
            </div>
          </div>
          <div class="p-3 rounded-lg bg-cyan-500/10 border border-cyan-500/30 text-[11px] text-cyan-200">
            <i class="fa-solid fa-info-circle ml-1"></i> ${learningPhase.recommendation}
          </div>
        </div>
      `;

      // Ad Fatigue
      document.getElementById('adFatigueSection').innerHTML = `
        <h3 class="font-bold text-white text-sm flex items-center gap-2">
          <i class="fa-solid fa-battery-quarter text-orange-400"></i> تحليل Ad Fatigue
        </h3>
        <div class="space-y-3">
          <div class="grid grid-cols-2 gap-2 text-[11px]">
            <div class="p-3 rounded-xl bg-black/30">
              <div class="text-slate-400">تعب أسبوعي</div>
              <div class="text-lg font-bold text-orange-400 font-sans">${adFatigue.weeklyFatigue}%</div>
            </div>
            <div class="p-3 rounded-xl bg-black/30">
              <div class="text-slate-400">تراجع الأداء</div>
              <div class="text-lg font-bold text-white font-sans">${adFatigue.degradation}%</div>
            </div>
          </div>
          <div class="p-3 rounded-lg bg-${adFatigue.severity === 'high' ? 'red' : adFatigue.severity === 'medium' ? 'amber' : 'green'}-500/10 border border-${adFatigue.severity === 'high' ? 'red' : adFatigue.severity === 'medium' ? 'amber' : 'green'}-500/30 text-[11px]">
            <i class="fa-solid fa-lightbulb ml-1"></i> ${adFatigue.recommendation}
          </div>
        </div>
      `;

      // Risks
      document.getElementById('risksSection').innerHTML = `
        <h3 class="font-bold text-white text-sm flex items-center gap-2">
          <i class="fa-solid fa-shield-halved text-red-400"></i> تحليل المخاطر
        </h3>
        <div class="p-4 rounded-xl ${risks.riskLevel === 'high' ? 'bg-red-500/10 border-red-500/40' : risks.riskLevel === 'medium' ? 'bg-amber-500/10 border-amber-500/40' : 'bg-green-500/10 border-green-500/40'} border">
          <div class="flex items-center justify-between mb-2">
            <span class="text-sm font-bold text-white">مستوى المخاطر الإجمالي</span>
            <span class="text-lg font-bold font-sans ${risks.riskLevel === 'high' ? 'text-red-400' : risks.riskLevel === 'medium' ? 'text-amber-400' : 'text-green-400'}">${risks.totalRiskScore}/100</span>
          </div>
          <div class="h-2 rounded-full bg-white/10 overflow-hidden">
            <div class="h-full rounded-full ${risks.riskLevel === 'high' ? 'bg-red-500' : risks.riskLevel === 'medium' ? 'bg-amber-500' : 'bg-green-500'}" style="width: ${risks.totalRiskScore}%"></div>
          </div>
          <div class="text-[10px] text-slate-400 mt-2">${risks.riskLabel}</div>
        </div>
        <div class="space-y-2">
          ${risks.risks.length === 0 ? '<div class="p-3 text-center text-xs text-slate-500">لا توجد مخاطر كبيرة — استراتيجية متوازنة ✅</div>' : ''}
          ${risks.risks.map(r => `
            <div class="p-3 rounded-xl border ${r.severity === 'high' ? 'bg-red-500/5 border-red-500/30' : r.severity === 'medium' ? 'bg-amber-500/5 border-amber-500/30' : 'bg-blue-500/5 border-blue-500/30'}">
              <div class="flex items-start gap-2">
                <i class="fa-solid ${r.severity === 'high' ? 'fa-circle-exclamation text-red-400' : r.severity === 'medium' ? 'fa-triangle-exclamation text-amber-400' : 'fa-info-circle text-blue-400'} mt-0.5"></i>
                <div class="flex-1">
                  <div class="text-xs font-bold text-white mb-1">${r.title}</div>
                  <div class="text-[11px] text-slate-300 leading-relaxed">${r.desc}</div>
                  <div class="text-[10px] text-green-400 mt-1.5"><i class="fa-solid fa-lightbulb"></i> ${r.mitigation}</div>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      `;

      // Recommendations
      document.getElementById('recommendationsSection').innerHTML = `
        <h3 class="font-bold text-white text-sm flex items-center gap-2">
          <i class="fa-solid fa-clipboard-list text-amber-400"></i> التوصيات (${recommendations.length})
        </h3>
        <div class="space-y-2">
          ${recommendations.map(r => {
            const colors = { urgent: 'red', high: 'amber', medium: 'blue', low: 'slate' };
            const c = colors[r.priority] || 'slate';
            return `
              <div class="p-3 rounded-xl bg-${c}-500/5 border border-${c}-500/30 flex items-start gap-3">
                <span class="px-2 py-0.5 rounded-full bg-${c}-500/20 text-${c}-400 text-[9px] font-bold whitespace-nowrap">${r.priority}</span>
                <div class="flex-1">
                  <div class="text-xs font-bold text-white">${r.title}</div>
                  <div class="text-[11px] text-slate-300 mt-0.5 leading-relaxed">${r.desc}</div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;

      // Optimizations
      document.getElementById('optimizationsSection').innerHTML = optimizations.length > 0 ? `
        <h3 class="font-bold text-white text-sm flex items-center gap-2">
          <i class="fa-solid fa-rocket text-purple-400"></i> فرص التحسين (${optimizations.length})
        </h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          ${optimizations.map(o => `
            <div class="p-3 rounded-xl bg-green-500/5 border border-green-500/30">
              <div class="flex items-center justify-between mb-1">
                <span class="text-[10px] text-green-400 font-bold"><i class="fa-solid fa-${o.impact === 'high' ? 'fire' : 'bolt'} ml-1"></i>${o.impact.toUpperCase()}</span>
                <span class="text-[9px] text-slate-500">${o.area}</span>
              </div>
              <div class="text-xs font-bold text-white mb-1">${o.suggestion}</div>
              <div class="text-[10px] text-slate-400">التحسن المتوقع: <strong class="text-green-400">${o.expectedGain}</strong></div>
            </div>
          `).join('')}
        </div>
      ` : '';

      // Scroll to top
      modal.scrollTop = 0;

      if (window.gtag) window.gtag('event', 'simulator_run_full', { score: scores.adjustedOverall });
    }

    // ============================================================
    // COHORT CHART
    // ============================================================
    function renderCohortChart(cohort) {
      const ctx = document.getElementById('cohortChart');
      if (!ctx || typeof Chart === 'undefined') return;
      if (cohortChartInstance) cohortChartInstance.destroy();

      cohortChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: cohort.cohorts.map(c => c.monthLabel),
          datasets: [
            {
              label: 'الإيرادات الشهرية (ج.م)',
              data: cohort.cohorts.map(c => c.revenue),
              borderColor: '#06b6d4',
              backgroundColor: 'rgba(6, 182, 212, 0.1)',
              fill: true,
              tension: 0.4,
              borderWidth: 2,
              pointRadius: 4,
              pointBackgroundColor: '#06b6d4'
            },
            {
              label: 'العملاء النشطين',
              data: cohort.cohorts.map(c => c.activeCustomers),
              borderColor: '#d946ef',
              backgroundColor: 'rgba(217, 70, 239, 0.1)',
              fill: false,
              tension: 0.4,
              borderWidth: 2,
              yAxisID: 'y1',
              pointRadius: 4,
              pointBackgroundColor: '#d946ef'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              labels: { color: '#cbd5e1', font: { family: 'IBM Plex Sans Arabic', size: 11 } }
            }
          },
          scales: {
            x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.05)' } },
            y: { position: 'right', ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.05)' } },
            y1: { position: 'left', ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { display: false } }
          }
        }
      });
    }

    // ============================================================
    // PDF EXPORT
    // ============================================================
    window.downloadReportPDF = () => {
      if (!lastResult) { alert('شغّل المحاكاة أولاً'); return; }
      const btn = event.target.closest('button');
      const origText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin ml-1"></i> جاري التحضير...';

      const html = generateReportHTML(lastResult);
      const container = document.getElementById('reportPdfContainer');
      container.innerHTML = html;

      const opt = {
        margin: [5, 5, 5, 5],
        filename: `Marketing_Report_${Date.now()}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, logging: false, backgroundColor: '#ffffff' },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      if (typeof html2pdf !== 'undefined') {
        html2pdf().set(opt).from(container).save().then(() => {
          container.innerHTML = '';
          btn.disabled = false;
          btn.innerHTML = origText;
        }).catch(err => {
          console.error(err);
          container.innerHTML = '';
          btn.disabled = false;
          btn.innerHTML = origText;
          alert('تعذر تحميل الـ PDF');
        });
      } else {
        alert('مكتبة PDF مش محملة');
        btn.disabled = false;
        btn.innerHTML = origText;
      }
    };

    window.closeResults = () => {
      document.getElementById('resultsModal').classList.add('hidden');
      document.body.style.overflow = '';
    };

    // ============================================================
    // RESET
    // ============================================================
    window.resetSimulator = () => {
      if (!confirm('هل أنت متأكد؟ سيتم حذف كل الاختيارات والبدء من الصفر.')) return;
      state = JSON.parse(JSON.stringify(DEFAULT_STATE));
      localStorage.removeItem('sim_v2_state');
      currentStage = 0;
      if (cohortChartInstance) { cohortChartInstance.destroy(); cohortChartInstance = null; }
      closeResults();
      renderStage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    // ============================================================
    // INIT
    // ============================================================
    loadState();
    renderStage();
  </script>
</body>
</html>
