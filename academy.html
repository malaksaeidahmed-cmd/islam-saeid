<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>أكاديمية إسلام سعيد | تعلم التسويق</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { font-family: 'IBM Plex Sans Arabic', sans-serif; background: #07060E; }
    .glass-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="text-slate-200 min-h-screen pb-20">

  <header class="glass-header border-b border-white/5 py-4 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-5 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-3">
        <img src="logo.png" alt="Logo" class="w-8 h-8 object-contain" />
        <span class="font-bold text-white hidden sm:block">أكاديمية إسلام سعيد</span>
      </a>
      
      <div class="flex items-center gap-4">
        <div class="text-left hidden sm:block">
          <div id="userName" class="text-sm font-bold text-white">جاري التحميل...</div>
          <div id="userLevel" class="text-[10px] text-pink-400">Level 1</div>
        </div>
        <div class="relative w-10 h-10 rounded-full bg-gradient-to-br from-pink-500 to-purple-600 flex items-center justify-center text-white font-bold border-2 border-white/10">
          <span id="userInitial">S</span>
        </div>
        <button onclick="logout()" class="text-slate-400 hover:text-red-400"><i class="fa-solid fa-power-off"></i></button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-5 py-10 space-y-10">
    <section class="p-8 rounded-3xl bg-gradient-to-br from-[#16112b] to-[#07060E] border border-white/10 flex flex-col md:flex-row items-center justify-between gap-6 relative overflow-hidden">
      <div class="relative z-10 space-y-2 text-center md:text-right">
        <h1 class="text-2xl sm:text-3xl font-bold text-white">جاهز تبدأ رحلة الاحتراف؟ 🚀</h1>
        <p class="text-sm text-slate-400 max-w-lg">أكمل المسارات التعليمية، طبق في المحاكي، واحصل على شهادات معتمدة.</p>
      </div>
    </section>

    <section class="grid grid-cols-2 md:grid-cols-4 gap-4" id="statsGrid"></section>

    <section>
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-white"><i class="fa-solid fa-map-signs text-pink-400 ml-2"></i> مسارات التعلم</h2>
      </div>
      <div id="coursesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-6"></div>
    </section>
  </main>

  <script type="module">
    import { requireStudentAuth, logoutStudent } from './js/auth/firebase-auth.js';
    import { getUserProfile, createUserProfile } from './js/auth/user-profile.js';
    import { COURSES, getCourseProgress, isCourseUnlocked } from './js/academy/courses-data.js';

    async function boot() {
      try {
        // 1. التأكد من تسجيل الدخول
        const user = await requireStudentAuth();

        // 2. جلب البروفايل (البيانات)
        let profile = await getUserProfile(user.uid);

        // 3. لو مفيش بروفايل (حساب قديم)، نعمله
        if (!profile) {
          console.log("Creating missing profile...");
          await createUserProfile(user.uid, { 
            email: user.email, 
            displayName: user.displayName || 'طالب جديد' 
          });
          profile = await getUserProfile(user.uid);
        }

        // 4. عرض البيانات في الشاشة
        if (profile) {
          document.getElementById('userName').textContent = profile.displayName;
          document.getElementById('userInitial').textContent = profile.displayName.charAt(0).toUpperCase();
          renderUI(profile);
        }

      } catch (error) {
        // لو حصل أي خطأ، هيظهر Alert أحمر
        alert("حدث خطأ: " + error.message);
        console.error(error);
        document.getElementById('userName').textContent = 'خطأ!';
      }
    }

    function renderUI(profile) {
      // إحصائيات ثابتة للتجربة
      document.getElementById('statsGrid').innerHTML = `
        <div class="p-5 rounded-2xl glass-card flex items-center gap-4">
          <div class="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center text-pink-400"><i class="fa-solid fa-star"></i></div>
          <div><div class="text-2xl font-bold text-white font-sans">${profile.xp || 0}</div><div class="text-[11px] text-slate-400">إجمالي النقاط</div></div>
        </div>
      `;

      // عرض المسارات الأربعة
      const container = document.getElementById('coursesGrid');
      container.innerHTML = COURSES.map(course => `
        <div class="p-6 rounded-3xl glass-card hover:border-pink-500/30 transition-all">
          <div class="w-14 h-14 rounded-2xl flex items-center justify-center text-2xl mb-4" style="background: ${course.color}20; color: ${course.color};">
            <i class="fa-solid ${course.icon}"></i>
          </div>
          <h3 class="text-lg font-bold text-white mb-2">${course.title}</h3>
          <p class="text-xs text-slate-400 leading-relaxed mb-6">${course.description}</p>
          <a href="course.html?course=${course.id}" class="block text-center w-full py-2 rounded-lg bg-white/5 hover:bg-white/10 text-white text-xs font-bold transition-colors">
            ابدأ المسار
          </a>
        </div>
      `).join('');
    }

    window.logout = async () => {
      await logoutStudent();
      window.location.href = 'auth.html';
    };

    boot();
  </script>
</body>
</html>
