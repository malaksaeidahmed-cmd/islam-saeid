<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المدونة والنشرات الإخبارية | إسلام سعيد</title>
  <meta name="description" content="مقالات ونشرات عربية حول الميديا باينج، ROAS، واستراتيجيات النمو الإعلاني من إسلام سعيد." />
  <link rel="canonical" href="https://islamsaeid.me/blog.html" />
  <meta property="og:title" content="المدونة والنشرات الإخبارية | إسلام سعيد" />
  <meta property="og:description" content="تحليلات عملية واستراتيجيات إعلانية قابلة للتنفيذ لأصحاب المشاريع والمسوقين." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://islamsaeid.me/logo.png" />
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-[#07060E] text-slate-200 font-['IBM_Plex_Sans_Arabic'] min-h-screen">

  <header class="glass-header border-b border-white/5 py-5 sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-5 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-3">
        <img src="logo.png" alt="شعار إسلام سعيد" class="w-9 h-9 object-contain rounded-lg" onerror="this.style.display='none'" />
        <span class="font-bold text-white">إسلام سعيد &bull; المدونة</span>
      </a>
      <a href="index.html" class="text-xs text-slate-300 hover:text-white">
        <i class="fa-solid fa-arrow-right ml-1"></i> العودة للموقع الرئيسي
      </a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-5 py-16 space-y-8">
    <div class="text-center space-y-3">
      <span class="text-xs font-bold text-pink-500 uppercase tracking-widest">معرفة وخبرات إعلانية</span>
      <h1 class="text-3xl font-bold text-white">نشرات الميديا باينج والنمو الإعلاني</h1>
      <p class="text-xs text-slate-400 max-w-lg mx-auto leading-relaxed">استراتيجيات متقدمة حول إعلانات Meta و TikTok واقتصاديات الوحدة لتنمية أعمالك.</p>
    </div>

    <div class="max-w-md mx-auto">
      <label for="blogSearchInput" class="sr-only">بحث في المقالات</label>
      <input type="text" id="blogSearchInput" placeholder="بحث في المقالات..."
        class="w-full bg-[#0E0B1A] border border-white/10 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-pink-500" />
    </div>

    <div id="categoryFilters" class="flex flex-wrap items-center justify-center gap-2">
      <button class="filter-chip active" data-cat="all">الكل</button>
    </div>

    <div id="blogStatus" class="text-center py-3 text-slate-500 text-xs">جاري جلب المقالات...</div>
    <div id="blogContainer" class="space-y-6"></div>
  </main>

  <script src="js/cms-data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>
  <script type="module">
    const statusEl = document.getElementById('blogStatus');
    const container = document.getElementById('blogContainer');
    const searchInput = document.getElementById('blogSearchInput');
    const filtersContainer = document.getElementById('categoryFilters');
    let allPosts = [];
    let activeCategory = 'all';
    let currentQuery = '';

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function cleanText(value) {
      return String(value ?? '').trim();
    }

    function isSafeMediaUrl(url) {
      if (!url) return false;
      try {
        const parsed = new URL(url, window.location.href);
        return ['http:', 'https:'].includes(parsed.protocol);
      } catch (_) { return false; }
    }

    function renderFilters() {
      const cats = new Set();
      allPosts.forEach(p => {
        const c = cleanText(p.category);
        if (c) cats.add(c);
      });
      const chips = ['<button class="filter-chip ' + (activeCategory === 'all' ? 'active' : '') + '" data-cat="all">الكل</button>'];
      cats.forEach(c => {
        chips.push(`<button class="filter-chip ${activeCategory === c ? 'active' : ''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`);
      });
      filtersContainer.innerHTML = chips.join('');
      filtersContainer.querySelectorAll('.filter-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          activeCategory = btn.dataset.cat;
          renderFilters();
          applyFilters();
        });
      });
    }

    function renderBlog(posts) {
      if (!posts.length) {
        container.innerHTML = '<p class="text-center text-slate-500 py-10 text-xs">لا توجد مقالات مطابقة للبحث حالياً.</p>';
        return;
      }

      container.innerHTML = posts.map(p => {
        const plainText = cleanText(p.content || p.excerpt || '');
        const excerpt = plainText.length > 140 ? `${plainText.substring(0, 140)}...` : plainText;
        const safeTitle = escapeHtml(p.title || 'بدون عنوان');
        const safeCategory = escapeHtml(p.category || 'عام');
        const safeAuthor = escapeHtml(p.author || 'إسلام سعيد');
        const postId = encodeURIComponent(String(p.id ?? ''));
        const hasImage = isSafeMediaUrl(p.image);

        return `
          <article class="p-6 rounded-3xl border border-white/10 bg-[#0E0B1A] space-y-4 hover:border-pink-500/40 transition-all flex flex-col justify-between overflow-safe-card">
            ${hasImage ? `<img src="${escapeHtml(p.image)}" alt="غلاف المقال: ${safeTitle}" class="w-full h-48 object-cover rounded-2xl" onerror="this.style.display='none'" loading="lazy" />` : ''}
            <div class="space-y-3">
              <div class="flex items-center justify-between text-xs flex-wrap gap-2">
                <span class="text-pink-400 font-bold break-words-safe">${safeCategory}</span>
                <span class="text-slate-500">${new Date(p.createdAt || Date.now()).toLocaleDateString('ar-EG')}</span>
              </div>
              <h2 class="text-xl font-bold text-white hover:text-pink-400 transition-colors break-words-safe">
                <a href="post.html?id=${postId}">${safeTitle}</a>
              </h2>
              <p class="text-xs text-slate-300 leading-relaxed break-words-safe">${escapeHtml(excerpt)}</p>
            </div>
            <div class="pt-3 border-t border-white/5 flex justify-between items-center text-xs gap-2 flex-wrap">
              <span class="text-slate-400 break-words-safe"><i class="fa-solid fa-pen-nib text-orange-400 ml-1"></i>${safeAuthor}</span>
              <a href="post.html?id=${postId}" class="text-pink-400 hover:text-white font-bold flex items-center gap-1">
                <span>اقرأ المقال بالكامل</span>
                <i class="fa-solid fa-chevron-left text-[10px]"></i>
              </a>
            </div>
          </article>
        `;
      }).join('');
    }

    function setStatus(text) {
      statusEl.textContent = text;
      statusEl.classList.remove('hidden');
    }

    function hideStatus() {
      statusEl.classList.add('hidden');
    }

    function applyFilters() {
      let filtered = allPosts;
      if (activeCategory !== 'all') {
        filtered = filtered.filter(p => cleanText(p.category) === activeCategory);
      }
      if (currentQuery) {
        const q = currentQuery.toLowerCase();
        filtered = filtered.filter(p =>
          cleanText(p.title).toLowerCase().includes(q) ||
          cleanText(p.content).toLowerCase().includes(q)
        );
      }
      renderBlog(filtered);
    }

    function bindSearch() {
      searchInput?.addEventListener('input', (e) => {
        currentQuery = String(e.target.value || '').trim();
        applyFilters();
      });
    }

    async function loadPosts() {
      bindSearch();

      try {
        const { CloudCMS } = await import('./js/firebase-cms.js');
        CloudCMS.subscribeBlog(posts => {
          allPosts = Array.isArray(posts) ? posts : [];
          hideStatus();
          renderFilters();
          applyFilters();
        });
        return;
      } catch (error) {
        console.warn('Cloud blog data unavailable, using local fallback.', error);
      }

      if (window.cmsEngine?.getBlog) {
        allPosts = window.cmsEngine.getBlog() || [];
        setStatus('يتم عرض نسخة محلية من المقالات بسبب تعذر الاتصال بالمصدر السحابي.');
        renderFilters();
        applyFilters();
      } else {
        setStatus('تعذر تحميل المقالات حالياً.');
      }
    }

    loadPosts();
  </script>
</body>
</html>
