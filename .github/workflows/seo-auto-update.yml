name: Auto Update SEO Files

on:
  # كل 6 ساعات
  schedule:
    - cron: '0 */6 * * *'
  
  # عند أي commit على main
  push:
    branches: [main]
  
  # يدوي من تبويب Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate SEO files
        run: node scripts/generate-seo.mjs

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sitemap.xml feed.xml seo-meta.json
          if git diff --staged --quiet; then
            echo "✓ No changes to commit"
          else
            git commit -m "chore: auto-update SEO files [skip ci]"
            git push
            echo "✓ Changes pushed"
          fi
