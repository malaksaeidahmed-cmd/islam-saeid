<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إدارة المشتركين | إسلام سعيد</title>
  <link rel="icon" type="image/png" href="../logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="bg-[#07060E] text-slate-200 font-['IBM_Plex_Sans_Arabic'] min-h-screen">

  <header class="glass-header border-b border-white/5 py-5 sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-5 flex justify-between items-center">
      <a href="dashboard.html" class="flex items-center gap-3">
        <img src="../logo.png" alt="إسلام سعيد" class="w-9 h-9 object-contain rounded-lg" onError="this.style.display='none'" />
        <span class="font-bold text-white">إدارة المشتركين</span>
      </a>
      <a href="dashboard.html" class="text-xs text-slate-300 hover:text-white">
        <i class="fa-solid fa-arrow-right ml-1"></i> العودة للوحة التحكم
      </a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-5 py-10 space-y-6">

    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
      <div class="p-4 rounded-xl bg-[#0E0B1A] border border-white/10">
        <div class="text-slate-400 mb-1">إجمالي المشتركين</div>
        <div id="statTotal" class="text-2xl font-bold text-white font-sans">0</div>
      </div>
      <div class="p-4 rounded-xl bg-[#0E0B1A] border border-white/10">
        <div class="text-slate-400 mb-1">نشطون</div>
        <div id="statActive" class="text-2xl font-bold text-green-400 font-sans">0</div>
      </div>
      <div class="p-4 rounded-xl bg-[#0E0B1A] border border-white/10">
        <div class="text-slate-400 mb-1">ملغون</div>
        <div id="statUnsub" class="text-2xl font-bold text-red-400 font-sans">0</div>
      </div>
      <div class="p-4 rounded-xl bg-[#0E0B1A] border border-white/10">
        <div class="text-slate-400 mb-1">آخر 30 يوم</div>
        <div id="stat30d" class="text-2xl font-bold text-pink-400 font-sans">0</div>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-2">
      <input type="text" id="searchInput" placeholder="ابحث بالبريد الإلكتروني..." 
        class="flex-1 min-w-[200px] bg-black/50 border border-white/10 rounded-lg px-3 py-2 text-white text-xs" />
      <select id="statusFilter" class="bg-black/50 border border-white/10 rounded-lg px-3 py-2 text-white text-xs">
        <option value="all">الكل</option>
        <option value="subscribed">نشطون</option>
        <option value="unsubscribed">ملغون</option>
      </select>
      <button onclick="exportCSV()" class="px-4 py-2 rounded-lg bg-gradient-to-r from-green-600 to-emerald-600 text-white font-bold text-xs">
        <i class="fa-solid fa-file-csv ml-1"></i> تصدير CSV
      </button>
    </div>

    <div id="subscribersList" class="space-y-3"></div>

  </main>

  <script type="module">
    import { subscribeSubscribers, deleteSubscriber } from '../js/newsletter.js';

    let allSubscribers = [];
    let currentQuery = '';
    let currentStatus = 'all';

    function escapeHtml(v) {
      return String(v ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function formatDate(ts) {
      if (!ts) return '—';
      return new Date(ts).toLocaleString('ar-EG', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    function renderStats() {
      const total = allSubscribers.length;
      const active = allSubscribers.filter(s => s.status === 'subscribed').length;
      const unsub = allSubscribers.filter(s => s.status === 'unsubscribed').length;
      const thirtyDaysAgo = Date.now() - (30 * 24 * 60 * 60 * 1000);
      const last30d = allSubscribers.filter(s => (s.createdAt || 0) >= thirtyDaysAgo).length;

      document.getElementById('statTotal').textContent = total;
      document.getElementById('statActive').textContent = active;
      document.getElementById('statUnsub').textContent = unsub;
      document.getElementById('stat30d').textContent = last30d;
    }

    function renderList() {
      const container = document.getElementById('subscribersList');
      let filtered = allSubscribers;

      if (currentStatus !== 'all') {
        filtered = filtered.filter(s => s.status === currentStatus);
      }

      if (currentQuery) {
        const q = currentQuery.toLowerCase();
        filtered = filtered.filter(s => (s.email || '').toLowerCase().includes(q));
      }

      if (!filtered.length) {
        container.innerHTML = `
          <div class="text-center py-16 space-y-3">
            <i class="fa-solid fa-envelope text-3xl text-slate-600"></i>
            <p class="text-slate-500 text-xs">لا يوجد مشتركون مطابقون</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(s => `
        <div class="p-4 rounded-xl bg-[#0E0B1A] border border-white/10 flex justify-between items-center gap-3 flex-wrap overflow-safe-card">
          <div class="min-w-0 flex-1">
            <div class="font-bold text-white text-sm break-words-safe" dir="ltr">${escapeHtml(s.email)}</div>
            <div class="flex items-center gap-3 text-[10px] text-slate-400 flex-wrap mt-1">
              <span class="px-2 py-0.5 rounded ${s.status === 'subscribed' ? 'bg-green-500/15 text-green-400' : 'bg-red-500/15 text-red-400'}">
                ${s.status === 'subscribed' ? 'نشط' : 'ملغي'}
              </span>
              ${s.source ? `<span><i class="fa-solid fa-tag ml-1"></i>${escapeHtml(s.source)}</span>` : ''}
              <span><i class="fa-solid fa-calendar ml-1"></i>${formatDate(s.createdAt)}</span>
            </div>
          </div>
          <button onclick="deleteSub('${s.id}')" class="px-3 py-1.5 rounded bg-red-500/15 text-red-300 hover:bg-red-500/25 text-[11px]">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
      `).join('');
    }

    window.deleteSub = async (id) => {
      if (!confirm('حذف هذا المشترك نهائياً؟')) return;
      try {
        await deleteSubscriber(id);
      } catch (err) {
        alert('تعذر الحذف');
      }
    };

    window.exportCSV = () => {
      if (!allSubscribers.length) { alert('لا يوجد مشتركون'); return; }
      const rows = [['Email', 'Status', 'Source', 'Subscribed At']];
      allSubscribers.forEach(s => {
        rows.push([
          s.email,
          s.status,
          s.source || '',
          s.createdAt ? new Date(s.createdAt).toISOString() : ''
        ]);
      });
      const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `newsletter-subscribers-${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    };

    document.getElementById('searchInput')?.addEventListener('input', (e) => {
      currentQuery = e.target.value;
      renderList();
    });

    document.getElementById('statusFilter')?.addEventListener('change', (e) => {
      currentStatus = e.target.value;
      renderList();
    });

    subscribeSubscribers(subs => {
      allSubscribers = subs || [];
      renderStats();
      renderList();
    });
  </script>
</body>
</html>
