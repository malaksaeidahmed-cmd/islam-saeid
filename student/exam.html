<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الامتحان | أكاديمية إسلام سعيد</title>
  <link rel="icon" type="image/png" href="../logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'IBM Plex Sans Arabic', sans-serif; background: #07050a; }
    .glass-card { background: rgba(14,11,26,0.85); border: 1px solid rgba(217,70,239,0.2); border-radius: 24px; }
    .loading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
  </style>
</head>
<body class="text-slate-200 min-h-screen pb-20">

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay hidden">
    <i class="fa-solid fa-spinner fa-spin text-4xl text-pink-500 mb-4"></i>
    <p class="text-white font-bold">جاري تصحيح الامتحان بالذكاء الاصطناعي...</p>
    <p class="text-xs text-slate-400 mt-2">قد يستغرق هذا بضع ثوانٍ</p>
  </div>

  <header class="border-b border-white/5 py-4 sticky top-0 z-50 bg-[#07050a]/90 backdrop-blur">
    <div class="max-w-4xl mx-auto px-5 flex justify-between items-center">
      <a href="dashboard.html" class="text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-right text-lg"></i></a>
      <div class="text-sm font-bold text-white" id="examTitle">جاري التحميل...</div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-5 py-8 space-y-6">

    <!-- Questions Container -->
    <div id="questionsContainer" class="space-y-6">
      <div class="text-center py-10 text-slate-400">جاري تحميل الأسئلة...</div>
    </div>

    <!-- Submit Button -->
    <div class="flex justify-end pt-4">
      <button id="submitExamBtn" onclick="submitExam()" class="px-8 py-3 rounded-xl bg-gradient-to-r from-pink-600 to-purple-600 text-white font-bold text-sm shadow-lg disabled:opacity-50 hidden">
        إنهاء وتسليم الامتحان
      </button>
    </div>

    <!-- Results Container (Hidden initially) -->
    <div id="resultsContainer" class="hidden space-y-6">
      <div class="glass-card p-8 text-center">
        <h2 class="text-2xl font-bold text-white mb-2">النتيجة النهائية</h2>
        <div class="text-6xl font-bold text-pink-500 mb-4" id="finalScore">0%</div>
        <div id="resultStatus" class="text-xl font-bold mb-4"></div>
        <p class="text-sm text-slate-400">لقد قمت بالإجابة على الامتحان. يمكنك مراجعة التقييمات أدناه.</p>
      </div>
      <div id="essayFeedbackContainer" class="space-y-4"></div>
      <div class="text-center">
        <a href="dashboard.html" class="inline-block px-6 py-3 rounded-xl bg-white/5 border border-white/10 text-white font-bold text-sm">العودة للوحة التحكم</a>
      </div>
    </div>

  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getExamData } from '../js/academy/exams-data.js';
    import { submitExam as submitExamLogic } from '../js/academy/exam-engine.js';
    import { firebaseConfig } from '../firebase-config.js';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const urlParams = new URLSearchParams(window.location.search);
    const examId = urlParams.get('id');
    let currentUser = null;
    let currentExam = null;
    let userAnswers = {};

    onAuthStateChanged(auth, (user) => {
      if (!user) { window.location.href = '../auth.html'; return; }
      currentUser = user;
      
      if (!examId) { window.location.href = 'dashboard.html'; return; }
      currentExam = getExamData(examId);
      
      if (!currentExam) {
        document.getElementById('questionsContainer').innerHTML = '<div class="text-red-400 text-center">الامتحان غير موجود.</div>';
        return;
      }

      document.getElementById('examTitle').textContent = currentExam.title;
      renderQuestions();
    });

    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      container.innerHTML = currentExam.questions.map((q, index) => {
        if (q.type === 'mcq') {
          return `
            <div class="glass-card p-6">
              <h3 class="font-bold text-white text-sm mb-4">${index + 1}. ${q.question}</h3>
              <div class="space-y-2">
                ${q.options.map((opt, oIndex) => `
                  <label class="flex items-center gap-3 p-3 rounded-xl border border-white/5 bg-white/[0.02] hover:bg-white/5 cursor-pointer">
                    <input type="radio" name="q_${q.id}" value="${oIndex}" onchange="saveAnswer('${q.id}', ${oIndex})" class="w-4 h-4 accent-pink-600" />
                    <span class="text-xs text-slate-300">${opt}</span>
                  </label>
                `).join('')}
              </div>
            </div>
          `;
        } else if (q.type === 'essay') {
          return `
            <div class="glass-card p-6">
              <h3 class="font-bold text-white text-sm mb-4">${index + 1}. ${q.question} <span class="text-xs text-pink-400">(${q.points} نقاط)</span></h3>
              <textarea id="q_${q.id}" oninput="saveAnswer('${q.id}', this.value)" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-pink-500 h-32" placeholder="اكتب إجابتك هنا..."></textarea>
            </div>
          `;
        }
      }).join('');

      document.getElementById('submitExamBtn').classList.remove('hidden');
    }

    window.saveAnswer = (questionId, value) => {
      userAnswers[questionId] = value;
    };

    window.submitExam = async () => {
      // التحقق من أن الطالب أجاب على كل الأسئلة
      const answeredCount = Object.keys(userAnswers).length;
      if (answeredCount < currentExam.questions.length) {
        if (!confirm('أنت لم تجب على جميع الأسئلة. هل أنت متأكد من إنهاء الامتحان؟')) {
          return;
        }
      }

      document.getElementById('loadingOverlay').classList.remove('hidden');
      document.getElementById('submitExamBtn').disabled = true;

      try {
        const result = await submitExamLogic(currentUser.uid, currentExam.id, userAnswers);
        showResults(result);
      } catch (error) {
        console.error(error);
        alert('حدث خطأ أثناء تصحيح الامتحان: ' + error.message);
        document.getElementById('loadingOverlay').classList.add('hidden');
        document.getElementById('submitExamBtn').disabled = false;
      }
    };

    function showResults(result) {
      document.getElementById('loadingOverlay').classList.add('hidden');
      document.getElementById('questionsContainer').classList.add('hidden');
      document.getElementById('submitExamBtn').classList.add('hidden');
      
      const resultsContainer = document.getElementById('resultsContainer');
      resultsContainer.classList.remove('hidden');

      document.getElementById('finalScore').textContent = result.percentage + '%';
      document.getElementById('finalScore').className = `text-6xl font-bold mb-4 ${result.passed ? 'text-green-400' : 'text-red-400'}`;
      
      const statusEl = document.getElementById('resultStatus');
      if (result.passed) {
        statusEl.textContent = '🎉 مبروك! لقد نجحت';
        statusEl.className = 'text-xl font-bold mb-4 text-green-400';
      } else {
        statusEl.textContent = '😅 للأسف، لم تجتز الاختبار';
        statusEl.className = 'text-xl font-bold mb-4 text-red-400';
      }

      // عرض تقييمات الأسئلة المقالية
      const feedbackContainer = document.getElementById('essayFeedbackContainer');
      if (result.essayResults && result.essayResults.length > 0) {
        feedbackContainer.innerHTML = `
          <h3 class="font-bold text-white text-sm mb-2">تقييم الأسئلة المقالية (بالذكاء الاصطناعي):</h3>
          ${result.essayResults.map(fb => `
            <div class="p-4 rounded-xl border border-white/10 bg-white/[0.02]">
              <div class="flex justify-between items-center mb-2">
                <div class="text-xs font-bold text-white">${fb.question}</div>
                <div class="text-xs font-bold text-pink-400">${fb.score} / ${fb.maxPoints}</div>
              </div>
              <div class="text-[11px] text-slate-300 mb-2"><strong>إجابتك:</strong> ${fb.answer}</div>
              <div class="text-[11px] text-green-400 mb-1"><strong>نقاط القوة:</strong> ${fb.aiFeedback.strengths.join(' - ')}</div>
              <div class="text-[11px] text-amber-400 mb-1"><strong>نقاط للتحسين:</strong> ${fb.aiFeedback.improvements.join(' - ')}</div>
              <div class="text-[11px] text-slate-400"><strong>توصية:</strong> ${fb.aiFeedback.recommendation}</div>
            </div>
          `).join('')}
        `;
      }
    }
  </script>
</body>
</html>
