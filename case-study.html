<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دراسة حالة | إسلام سعيد</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-[#07060E] text-slate-200 font-['IBM_Plex_Sans_Arabic'] min-h-screen">

  <header class="glass-header border-b border-white/5 py-5 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-5 flex justify-between items-center">
      <a href="index.html#portfolio" class="flex items-center gap-3">
        <img src="assets/logo.png" alt="إسلام سعيد" class="w-9 h-9 object-contain rounded-lg" onError="this.style.display='none'" />
        <span class="font-bold text-white">دراسة حالة وسابقة الأعمال</span>
      </a>
      <a href="index.html#portfolio" class="text-xs text-slate-300 hover:text-white">
        <i class="fa-solid fa-arrow-right ml-1"></i> العودة لسابقة الأعمال
      </a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-5 py-12 space-y-8">
    <div id="caseLoading" class="text-center text-slate-400 py-20 text-sm">جاري تحميل تفاصيل الحملة...</div>

    <div id="caseContent" class="hidden space-y-8">
      <div class="p-8 rounded-3xl border border-white/10 bg-[#0E0B1A] space-y-4">
        <div class="flex items-center justify-between text-xs">
          <span id="csCategory" class="text-pink-400 font-bold"></span>
          <span id="csRoas" class="px-3 py-1 rounded-lg bg-amber-500/10 text-amber-400 font-bold font-sans"></span>
        </div>
        <h1 id="csTitle" class="text-2xl sm:text-4xl font-bold text-white"></h1>
        <p id="csDesc" class="text-xs sm:text-sm text-slate-300 leading-relaxed"></p>

        <div class="grid grid-cols-2 gap-4 pt-4 border-t border-white/10 text-xs">
          <div class="p-4 rounded-xl bg-white/[0.02]">
            <span class="text-slate-400 block mb-1">الميزانية / الوصول:</span>
            <span id="csBudget" class="text-base font-bold text-white font-sans"></span>
          </div>
          <div class="p-4 rounded-xl bg-white/[0.02]">
            <span class="text-slate-400 block mb-1">المبيعات / النتائج المحققة:</span>
            <span id="csResults" class="text-base font-bold text-green-400 font-sans"></span>
          </div>
        </div>
      </div>

      <div class="p-8 rounded-3xl border border-white/10 bg-[#0E0B1A] space-y-4">
        <h3 class="text-lg font-bold text-white border-b border-white/10 pb-3">تفاصيل الاستراتيجية والميديا</h3>
        <div id="csDetails" class="text-sm leading-relaxed text-slate-300 space-y-4"></div>
      </div>
    </div>
  </main>

  <script type="module">
    import { CloudCMS } from './js/firebase-cms.js';

    const urlParams = new URLSearchParams(window.location.search);
    const csId = urlParams.get('id');

    if (!csId) {
      window.location.href = 'index.html#portfolio';
    } else {
      CloudCMS.getPortfolioItemById(csId).then(item => {
        if (!item) {
          document.getElementById('caseLoading').textContent = 'المشروع غير موجود.';
          return;
        }

        document.getElementById('caseLoading').classList.add('hidden');
        document.getElementById('caseContent').classList.remove('hidden');

        document.getElementById('csCategory').textContent = item.category;
        document.getElementById('csRoas').textContent = item.roas;
        document.getElementById('csTitle').textContent = item.title;
        document.getElementById('csDesc').textContent = item.desc;
        document.getElementById('csBudget').textContent = item.budget;
        document.getElementById('csResults').textContent = item.results;
        document.getElementById('csDetails').innerHTML = item.details || item.desc;
      });
    }
  </script>
</body>
</html>
