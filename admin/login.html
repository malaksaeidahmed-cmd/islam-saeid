<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول | لوحة التحكم</title>
  <link rel="icon" type="image/png" href="../assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#07060E] text-slate-200 font-['IBM_Plex_Sans_Arabic'] min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md p-8 rounded-3xl border border-white/10 bg-[#0E0B1A] space-y-6 shadow-2xl">
    <div class="text-center space-y-2">
      <img src="../assets/logo.png" alt="Logo" class="w-12 h-12 object-contain mx-auto rounded-xl border border-white/10" onError="this.style.display='none'" />
      <h1 class="text-xl font-bold text-white">تسجيل الدخول للوحة الإدارة</h1>
      <p class="text-xs text-slate-400">أدخل اسم المستخدم وكلمة المرور للمتابعة</p>
    </div>

    <form id="loginForm" class="space-y-4 text-xs">
      <div>
        <label class="block font-semibold text-slate-300 mb-1">اسم المستخدم (Username):</label>
        <input type="text" id="userInput" required placeholder="islam" class="w-full bg-black/50 border border-white/10 rounded-xl p-3 text-white focus:outline-none focus:border-purple-500" />
      </div>
      <div>
        <label class="block font-semibold text-slate-300 mb-1">كلمة المرور:</label>
        <input type="password" id="passInput" required placeholder="••••••••" class="w-full bg-black/50 border border-white/10 rounded-xl p-3 text-white focus:outline-none focus:border-purple-500" />
      </div>

      <div id="loginError" class="hidden p-3 rounded-lg bg-red-500/20 border border-red-500/40 text-red-300 text-center font-semibold">
        اسم المستخدم أو كلمة المرور غير صحيحة
      </div>

      <button type="submit" class="w-full py-3 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold transition-all shadow-lg text-xs">
        دخول لوحة التحكم
      </button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('userInput').value.trim();
      const pass = document.getElementById('passInput').value;

      if (user === 'islam' && pass === 'Nour123@@##') {
        sessionStorage.setItem('cms_auth', JSON.stringify({ name: "إسلام سعيد", role: "Admin" }));
        window.location.href = 'dashboard.html';
      } else {
        document.getElementById('loginError').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
