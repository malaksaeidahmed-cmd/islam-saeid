<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة الطالب | أكاديمية إسلام سعيد</title>
  <link rel="icon" type="image/png" href="../logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'IBM Plex Sans Arabic', sans-serif; background: #07050a; }
    .glass-card { background: rgba(14,11,26,0.85); border: 1px solid rgba(217,70,239,0.2); border-radius: 24px; }
  </style>
</head>
<body class="text-slate-200 min-h-screen pb-20">

  <header class="border-b border-white/5 py-4 sticky top-0 z-50 bg-[#07050a]/90 backdrop-blur">
    <div class="max-w-6xl mx-auto px-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <img src="../logo.png" class="w-8 h-8 rounded-lg" alt="Logo" />
        <span class="font-bold text-white">أكاديمية إسلام سعيد</span>
      </div>
      <div class="flex items-center gap-4">
        <div class="text-right hidden sm:block">
          <div class="text-xs font-bold text-white" id="userName">جاري التحميل...</div>
          <div class="text-[10px] text-pink-400" id="userLevel">Level 1</div>
        </div>
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-pink-500 to-purple-600 flex items-center justify-center text-white font-bold border-2 border-white/10" id="userAvatar">S</div>
        <button onclick="logout()" class="text-slate-400 hover:text-red-400"><i class="fa-solid fa-power-off"></i></button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-5 py-8 space-y-8">

    <!-- Progress Stats -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="glass-card p-6 flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-green-500/10 text-green-400 flex items-center justify-center text-xl"><i class="fa-solid fa-book-open"></i></div>
        <div>
          <div class="text-2xl font-bold text-white" id="completedLessonsCount">0</div>
          <div class="text-xs text-slate-400">دروس مكتملة</div>
        </div>
      </div>
      <div class="glass-card p-6 flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-blue-500/10 text-blue-400 flex items-center justify-center text-xl"><i class="fa-solid fa-check-double"></i></div>
        <div>
          <div class="text-2xl font-bold text-white" id="passedExamsCount">0</div>
          <div class="text-xs text-slate-400">اختبارات ناجحة</div>
        </div>
      </div>
      <div class="glass-card p-6 flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-pink-500/10 text-pink-400 flex items-center justify-center text-xl"><i class="fa-solid fa-star"></i></div>
        <div>
          <div class="text-2xl font-bold text-white" id="totalXP">0</div>
          <div class="text-xs text-slate-400">إجمالي النقاط (XP)</div>
        </div>
      </div>
    </section>

    <!-- Units -->
    <section>
      <h2 class="text-xl font-bold text-white mb-6"><i class="fa-solid fa-map-signs text-pink-400 ml-2"></i> الوحدات التعليمية</h2>
      <div id="unitsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="text-center py-10 text-slate-400 col-span-2">جاري تحميل الوحدات...</div>
      </div>
    </section>

    <!-- Certificates -->
    <section class="glass-card p-6 md:p-8">
      <h2 class="text-xl font-bold text-white mb-4"><i class="fa-solid fa-award text-gold ml-2"></i> الشهادات</h2>
      <div id="certificatesContainer" class="text-sm text-slate-400">
        لا توجد شهادات بعد. أكمل الوحدات المطلوبة للحصول على شهادتك.
      </div>
    </section>

  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { firebaseConfig } from '../firebase-config.js';
    import { UNITS, getUnitById } from '../js/academy/units-data.js';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let userProgress = null;

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = '../auth.html'; return; }
      currentUser = user;

      // Fetch user profile
      const userSnap = await getDoc(doc(db, 'users', user.uid));
      if (userSnap.exists()) {
        const data = userSnap.data();
        document.getElementById('userName').textContent = data.displayName || data.username;
        document.getElementById('userAvatar').textContent = (data.displayName || data.username || 'S').charAt(0).toUpperCase();
        document.getElementById('totalXP').textContent = data.xp || 0;
      }

      // Listen to progress
      onSnapshot(doc(db, 'student_progress', user.uid), (snap) => {
        if (snap.exists()) {
          userProgress = snap.data();
          renderDashboard();
        }
      });
    });

    function renderDashboard() {
      if (!userProgress) return;

      document.getElementById('completedLessonsCount').textContent = userProgress.completedLessons?.length || 0;
      document.getElementById('passedExamsCount').textContent = userProgress.unitExamResults?.filter(r => r.passed)?.length || 0;

      const container = document.getElementById('unitsContainer');
      const unlocked = userProgress.unlockedUnits || [1];

      container.innerHTML = UNITS.map(unit => {
        const isUnlocked = unlocked.includes(unit.order);
        const completedInUnit = unit.lessons.filter(l => userProgress.completedLessons?.includes(l.id)).length;
        const totalLessons = unit.lessons.length;
        const progressPercent = totalLessons > 0 ? Math.round((completedInUnit / totalLessons) * 100) : 0;

        return `
          <div class="relative glass-card p-6 ${isUnlocked ? 'hover:border-pink-500/40' : 'opacity-60 grayscale-[50%]'} transition-all">
            ${!isUnlocked ? `
              <div class="absolute inset-0 bg-black/70 rounded-3xl z-20 flex flex-col items-center justify-center backdrop-blur-sm">
                <i class="fa-solid fa-lock text-3xl text-slate-500 mb-2"></i>
                <span class="text-xs text-slate-400">لم يتم فتح هذه الوحدة بعد</span>
              </div>
            ` : ''}
            
            <div class="flex items-start justify-between mb-4">
              <div class="w-12 h-12 rounded-xl flex items-center justify-center text-xl" style="background: ${unit.color}20; color: ${unit.color};">
                <i class="fa-solid ${unit.icon}"></i>
              </div>
              <span class="px-2 py-0.5 rounded-full bg-white/5 text-[10px] text-slate-300 border border-white/10">الوحدة ${unit.order}</span>
            </div>
            
            <h3 class="text-lg font-bold text-white mb-2">${unit.title}</h3>
            
            <div class="flex items-center justify-between text-xs mb-4">
              <span class="text-slate-400">${completedInUnit} / ${totalLessons} درس</span>
              <span class="font-bold ${progressPercent === 100 ? 'text-green-400' : 'text-pink-400'}">${progressPercent}%</span>
            </div>
            
            <div class="h-1.5 w-full bg-white/5 rounded-full overflow-hidden mb-4">
              <div class="h-full rounded-full transition-all" style="width: ${progressPercent}%; background: ${progressPercent === 100 ? '#22c55e' : unit.color};"></div>
            </div>

            ${isUnlocked ? `
              <a href="lesson-viewer.html?unit=${unit.id}" class="block w-full text-center py-2.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-white text-xs font-bold transition-colors">
                ${progressPercent > 0 ? 'استكمال' : 'ابدأ'} <i class="fa-solid fa-arrow-left mr-1"></i>
              </a>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    window.logout = async () => {
      await signOut(auth);
      window.location.href = '../auth.html';
    };
  </script>
</body>
</html>
