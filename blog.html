<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المدونة والنشرات الإخبارية | إسلام سعيد</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-[#07060E] text-slate-200 font-['IBM_Plex_Sans_Arabic'] min-h-screen">

  <!-- Header -->
  <header class="glass-header border-b border-white/5 py-5 sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-5 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-3">
        <img src="assets/logo.png" alt="إسلام سعيد" class="w-9 h-9 object-contain rounded-lg" />
        <span class="font-bold text-white">إسلام سعيد &bull; المدونة</span>
      </a>
      <a href="index.html" class="text-xs text-slate-300 hover:text-white">
        <i class="fa-solid fa-arrow-right ml-1"></i> العودة للموقع الرئيسي
      </a>
    </div>
  </header>

  <!-- Content -->
  <main class="max-w-4xl mx-auto px-5 py-16 space-y-10">
    <div class="text-center space-y-3">
      <span class="text-xs font-bold text-pink-500 uppercase tracking-widest">معرفة وخبرات إعلانية</span>
      <h1 class="text-3xl font-bold text-white">نشرات الميديا باينج والنمو الإعلاني</h1>
      <p class="text-xs text-slate-400 max-w-lg mx-auto leading-relaxed">مقالات واستراتيجيات متقدمة حول إعلانات Meta و TikTok واقتصاديات الوحدة لتنمية أعمالك.</p>
    </div>

    <div id="blogContainer" class="space-y-6"></div>
  </main>

  <script src="js/cms-data.js"></script>
  <script>
    const posts = window.cmsEngine.getBlog();
    const container = document.getElementById('blogContainer');

    container.innerHTML = posts.map(p => `
      <article class="p-6 rounded-3xl border border-white/10 bg-[#0E0B1A] space-y-4 hover:border-pink-500/40 transition-all">
        <div class="flex items-center justify-between text-xs">
          <span class="text-pink-400 font-bold">${p.category}</span>
          <span class="text-slate-500">${p.date}</span>
        </div>
        <h2 class="text-xl font-bold text-white">${p.title}</h2>
        <p class="text-xs text-slate-300 leading-relaxed">${p.content}</p>
        <div class="pt-2 border-t border-white/5 flex items-center gap-2 text-xs text-slate-400">
          <i class="fa-solid fa-pen-nib text-brand-orange"></i>
          <span>بقلم: ${p.author}</span>
        </div>
      </article>
    `).join('');
  </script>
</body>
</html>
