<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الاختبار | أكاديمية إسلام سعيد</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="text-slate-200 min-h-screen pb-20">

  <header class="glass-header border-b border-white/5 py-4 sticky top-0 z-50">
    <div class="max-w-3xl mx-auto px-5 flex justify-between items-center">
      <a href="academy.html" class="text-slate-400 hover:text-white text-sm">
        <i class="fa-solid fa-arrow-right ml-1"></i> العودة للأكاديمية
      </a>
      <div id="quizTitle" class="text-xs font-bold text-white"></div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-5 py-10 space-y-6">
    
    <div id="loading" class="text-center py-20 text-slate-400">
      <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i> جاري تحميل الاختبار...
    </div>

    <!-- Quiz Form -->
    <div id="quizFormBox" class="hidden space-y-6">
      <div id="questionsContainer" class="space-y-6"></div>
      
      <div class="p-4 rounded-2xl bg-black/40 border border-white/10 flex justify-between items-center">
        <div class="text-xs text-slate-400">
          <span id="progressText">0 / 0</span> تمت الإجابة
        </div>
        <button id="submitBtn" onclick="submitQuiz()" class="px-6 py-3 rounded-xl bg-gradient-to-r from-pink-600 to-purple-600 text-white font-bold text-sm shadow-lg disabled:opacity-50 disabled:cursor-not-allowed">
          إنهاء وتسليم الاختبار
        </button>
      </div>
    </div>

    <!-- Results Box -->
    <div id="resultsBox" class="hidden space-y-6">
      <div class="p-8 rounded-3xl border text-center relative overflow-hidden" id="resultHeader">
        <div id="resultIcon" class="text-5xl mb-4"></div>
        <h2 class="text-2xl font-bold text-white mb-2" id="resultTitle"></h2>
        <p class="text-sm text-slate-300 mb-4" id="resultSubtitle"></p>
        <div class="text-5xl font-bold text-white font-sans mb-6" id="resultScore"></div>
        
        <div class="flex justify-center gap-3">
          <a href="academy.html" class="px-5 py-2.5 rounded-lg bg-white/10 text-white font-bold text-xs hover:bg-white/20">العودة للأكاديمية</a>
          <button onclick="window.location.reload()" class="px-5 py-2.5 rounded-lg bg-white/5 text-slate-300 font-bold text-xs hover:bg-white/10">إعادة المحاولة</button>
        </div>
      </div>

      <div class="space-y-4">
        <h3 class="font-bold text-white text-sm">مراجعة الإجابات:</h3>
        <div id="reviewContainer" class="space-y-4"></div>
      </div>
    </div>

  </main>

  <script type="module">
    import { requireStudentAuth } from './js/auth/firebase-auth.js';
    import { getUserProfile } from './js/auth/user-profile.js';
    import { getQuizData } from './js/academy/quizzes-data.js';
    import { evaluateQuiz, saveQuizResult } from './js/academy/quiz-engine.js';

    const user = await requireStudentAuth();
    
    const urlParams = new URLSearchParams(window.location.search);
    const quizId = urlParams.get('id');
    const courseId = urlParams.get('course');

    const quiz = getQuizData(quizId);

    if (!quiz) {
      document.getElementById('loading').innerHTML = 'الاختبار غير موجود.';
    } else {
      initQuiz(quiz);
    }

    function initQuiz(data) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('quizFormBox').classList.remove('hidden');
      document.getElementById('quizTitle').textContent = data.title;

      const container = document.getElementById('questionsContainer');
      let answeredCount = 0;
      const userAnswers = new Array(data.questions.length).fill(null);

      container.innerHTML = data.questions.map((q, qIndex) => `
        <div class="p-6 rounded-2xl bg-[#0E0B1A] border border-white/10" id="q_box_${qIndex}">
          <h3 class="font-bold text-white text-sm mb-4"><span class="text-pink-400">${qIndex + 1}.</span> ${q.question}</h3>
          <div class="space-y-2">
            ${q.options.map((opt, oIndex) => `
              <label class="flex items-center gap-3 p-3 rounded-xl border border-white/5 bg-white/[0.02] hover:bg-white/5 cursor-pointer transition-colors">
                <input type="radio" name="q_${qIndex}" value="${oIndex}" onchange="handleSelect(${qIndex}, ${oIndex})" class="w-4 h-4 accent-pink-600" />
                <span class="text-xs text-slate-300">${opt}</span>
              </label>
            `).join('')}
          </div>
        </div>
      `).join('');

      document.getElementById('progressText').textContent = `0 / ${data.questions.length}`;

      window.handleSelect = (qIdx, oIdx) => {
        if (userAnswers[qIdx] === null) answeredCount++;
        userAnswers[qIdx] = oIdx;
        document.getElementById('progressText').textContent = `${answeredCount} / ${data.questions.length}`;
        
        // Enable submit only if all answered
        const btn = document.getElementById('submitBtn');
        if (answeredCount === data.questions.length) {
          btn.disabled = false;
        } else {
          btn.disabled = true;
        }
      };

      window.submitQuiz = async () => {
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري التصحيح...';

        // 1. Evaluate
        const evaluation = evaluateQuiz(data, userAnswers);

        // 2. Save
        await saveQuizResult(user.uid, data.id, data.lessonId, evaluation, 0); // time can be tracked if needed

        // 3. Show Results
        showResults(evaluation, data);
      };
    }

    function showResults(evalData, quizData) {
      document.getElementById('quizFormBox').classList.add('hidden');
      const resultsBox = document.getElementById('resultsBox');
      resultsBox.classList.remove('hidden');

      const header = document.getElementById('resultHeader');
      const icon = document.getElementById('resultIcon');
      const title = document.getElementById('resultTitle');
      const subtitle = document.getElementById('resultSubtitle');
      const score = document.getElementById('resultScore');

      if (evalData.passed) {
        header.className = 'p-8 rounded-3xl border border-green-500/30 bg-green-500/10 text-center relative overflow-hidden';
        icon.innerHTML = '🎉';
        title.textContent = 'مبروك! لقد نجحت';
        subtitle.textContent = 'لقد اجتزت الاختبار بنجاح وحصلت على نقاط الخبرة.';
        score.className = 'text-5xl font-bold text-green-400 font-sans mb-6';
      } else {
        header.className = 'p-8 rounded-3xl border border-red-500/30 bg-red-500/10 text-center relative overflow-hidden';
        icon.innerHTML = '😅';
        title.textContent = 'للأسف، لم تجتز الاختبار';
        subtitle.textContent = 'تحتاج إلى مراجعة الدروس والمحاولة مرة أخرى.';
        score.className = 'text-5xl font-bold text-red-400 font-sans mb-6';
      }

      score.textContent = `${evalData.score}%`;
      document.getElementById('reviewContainer').innerHTML = evalData.results.map((r, i) => `
        <div class="p-4 rounded-xl border ${r.isCorrect ? 'border-green-500/30 bg-green-500/5' : 'border-red-500/30 bg-red-500/5'}">
          <div class="flex items-start gap-3">
            <div class="mt-1 ${r.isCorrect ? 'text-green-400' : 'text-red-400'}">
              <i class="fa-solid ${r.isCorrect ? 'fa-check-circle' : 'fa-times-circle'}"></i>
            </div>
            <div>
              <div class="text-sm font-bold text-white mb-1">${r.question}</div>
              ${!r.isCorrect ? `<div class="text-xs text-red-400 mb-1">إجابتك: ${r.options[r.userAnswer] || 'لم تجب'}</div>` : ''}
              <div class="text-xs text-green-400 mb-1">الإجابة الصحيحة: ${r.options[r.correctAnswer]}</div>
              <div class="text-[11px] text-slate-400 mt-2"><i class="fa-solid fa-circle-info ml-1"></i> ${r.explanation}</div>
            </div>
          </div>
        </div>
      `).join('');

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
